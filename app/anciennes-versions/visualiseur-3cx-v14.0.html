// ---------- Pièges d'acheminement (onglet) ----------
const TRAP_CAT = {loop: ['Boucle', 'bad'], gone: ['Destination disparue', 'bad'], off: ['Poste désactivé', 'bad'], noflow: ['Sans issue', 'warn'], empty: ['Sans membre', 'bad'], vmonly: ['SDA → messagerie', '']};
let TRAP_CACHE = null;
function trapAnalysis(){
  if(TRAP_CACHE) return TRAP_CACHE;
  const T = [], add = (cat, sev, el, title, detail, fix) => T.push({cat, sev, el, title, detail, fix});
  const via = d => d && d.dn && d.to && !['External', 'None', 'EndCall'].includes(d.to) ? d.dn : '';
  const exists = n => !!DN[n] || FULL.parks.includes(n);
  const ext = n => EXT_BY[n];
  // 1) destinations disparues ou postes désactivés : tout ce qui pointe vers un numéro (index des références inverses)
  Object.entries(dnRefs()).forEach(([n, refs]) => { const calls = refs.filter(r => r.cat !== 'member'); if(!calls.length) return;
    if(!exists(n)) calls.forEach(r => add('gone', 'bad', r.from, `${r.what} → ${n}, qui n'existe plus`, r.how, 'Choisir une nouvelle destination dans la console 3CX.'));
    else { const e = ext(n); if(e && e.enabled === false) calls.filter(r => r.cat !== 'fwd').forEach(r => add('off', 'bad', r.from, `${r.what} → poste ${n} ${dnName(n)}, désactivé`, r.how, 'Remplacer par un poste actif, une file ou un groupe.')); } });
  // 2) boucles sans intervention du client : débordements de files, groupes sans réponse, acheminement des départements, renvois « sans réponse », délai des menus
  const E = {}, edge = (a, b, how) => { if(a && b && a !== b) (E[a] ||= []).push([b, how]); };
  FULL.queues.forEach(q => edge(q.number, via(q.dest), 'débordement'));
  FULL.ringGroups.forEach(r => edge(r.number, via(r.dest), 'sans réponse'));
  FULL.groups.filter(g => !isSysGroup(g)).forEach(g => ['office', 'outOfOffice'].forEach(k => edge(g.number, via(g.routes[k]), k === 'office' ? 'ouvert' : 'fermé')));
  FULL.ivrs.forEach(i => { if(i.timeoutDN && !['EndCall', 'None', 'RepeatPrompt'].includes(i.timeoutType)) edge(i.number, i.timeoutDN, 'sans choix'); });
  FULL.extensions.forEach(e => { const p = e.profiles.find(x => x.name === (e.profile || 'Available')) || e.profiles.find(x => x.name === 'Available'); if(!p) return;
    const r = p.routes.find(([k]) => /NoAnswer › AllCalls$/.test(k)); if(r && r[1].to !== 'VoiceMail') edge(e.number, via(r[1]), 'sans réponse'); });
  const seen = new Set(), stack = [], onStack = new Set(), cycles = new Map();
  const dfs = n => { if(onStack.has(n)){ const c = stack.slice(stack.findIndex(x => x[0] === n)); const key = c.map(x => x[0]).slice().sort().join('>'); if(!cycles.has(key)) cycles.set(key, c); return; }
    if(seen.has(n)) return; seen.add(n); onStack.add(n);
    (E[n] || []).forEach(([b, how]) => { stack.push([n, how]); dfs(b); stack.pop(); }); onStack.delete(n); };
  Object.keys(E).forEach(n => dfs(n));
  cycles.forEach(c => { const path = c.map(([n, how]) => `${n} ${dnName(n)} (${how})`).join(' → ') + ` → ${c[0][0]}`;
    add('loop', c.every(([, how]) => how === 'sans choix') ? 'warn' : 'bad', c[0][0], `Boucle de ${c.length} élément${c.length > 1 ? 's' : ''} sans issue`, path, "Faire sortir la boucle vers une messagerie, une file avec agents ou un poste."); });
  // 3) sans issue
  FULL.queues.forEach(q => {
    if(!q.dest || !q.dest.to || ['None', 'EndCall'].includes(q.dest.to)) add('noflow', 'warn', q.number, "File sans destination à l'attente maximale", `Après ${q.masterTimeout || '?'} s d'attente, l'appel est raccroché.`, 'Définir une destination au délai maximal (messagerie, autre file, poste).');
    if(!q.members.length) add('empty', via(q.dest) ? 'warn' : 'bad', q.number, "File sans aucun agent", via(q.dest) ? `Les appels passent au débordement (${via(q.dest)} ${dnName(via(q.dest))}) après l'attente maximale.` : "Les appels attendent puis sont raccrochés.", "Ajouter des agents ou retirer la file de l'acheminement.");
    else if(!q.members.some(m => m.status === 'LoggedIn')) add('empty', 'warn', q.number, "Aucun agent connecté à la file (au moment du backup)", `${q.members.length} agent${q.members.length > 1 ? 's' : ''}, tous déconnectés.`, "Vérifier que les agents se connectent à la file.");
  });
  FULL.ringGroups.forEach(r => { if(!r.members.length) add('empty', via(r.dest) ? 'warn' : 'bad', r.number, 'Groupe de sonnerie sans membre', via(r.dest) ? `Les appels vont directement à ${via(r.dest)} ${dnName(via(r.dest))}.` : 'Les appels ne sonnent nulle part.', 'Ajouter des membres ou retirer le groupe.');
    if(!r.dest || !r.dest.to || ['None', 'EndCall'].includes(r.dest.to)) add('noflow', 'warn', r.number, 'Groupe de sonnerie sans destination si personne ne répond', `Après ${r.ringTime || '?'} s, l'appel est raccroché.`, 'Définir une destination sans réponse (messagerie, file…).'); });
  // un menu sans touche est un message seulement (intro, fermé) : normal s'il passe ensuite à une destination
  FULL.ivrs.forEach(i => { if(!i.timeoutType || ['EndCall', 'None'].includes(i.timeoutType)) add('noflow', i.options.length ? 'warn' : 'info', i.number,
    i.options.length ? 'Menu qui raccroche si le client ne choisit rien' : 'Message seulement, puis raccroche', i.options.length ? `Après ${i.timeout || '?'} s sans choix.` : "Menu sans touche : le message joue puis l'appel se termine (normal pour un message de fermeture).",
    i.options.length ? 'Choisir une destination « sans choix » (réception, file, messagerie).' : "Vérifier que c'est voulu (message de fermeture) ; sinon, choisir une destination après le message."); });
  // 4) SDA qui mènent directement à une messagerie
  FULL.lines.forEach(l => { const by = {}; l.rules.forEach(r => by[r.data] = r); const def = l.rules.find(r => r.cond === 'ForwardAll');
    l.dids.forEach(did => { const r = by[did] || def; if(r && r.office && r.office.to === 'VoiceMail') add('vmonly', 'info', r.office.dn || l.number, `SDA ${phone(did)} → messagerie, même aux heures d'ouverture`, `Trunk ${l.number}${by[did] ? '' : ' (règle par défaut)'} · messagerie de ${r.office.dn || '?'} ${dnName(r.office.dn || '')}`, "Vérifier que c'est voulu : aucun employé ne peut répondre à ce numéro."); }); });
  return TRAP_CACHE = T;
}

const RX_FLAG = {inactive: ['Poste inactif', 'bad'], other: ["Cellulaire d'un autre employé", 'warn'], unknown: ['Numéro non reconnu', 'warn'], own: ['Son cellulaire', 'ok'], disabled: ['Poste désactivé', '']};
let RX_CACHE = null;
function rxAnalysis(){
  if(RX_CACHE) return RX_CACHE;
  const calls = FULL.calls, end = calls.length ? calls[0][0] : new Date().toISOString(), lim30 = new Date(Date.parse(end) - 30 * 864e5).toISOString();
  const mob = {}; FULL.extensions.forEach(e => { const k = normNum(e.mobile); if(k) (mob[k] ||= []).push(e.number); });
  // activité : dernier appel répondu ou passé par le poste ; appels renvoyés vers l'extérieur par le poste (dernier élément du parcours)
  const last = {}, fw = {};
  for(const c of calls){ const a = c[6] && c[6] !== 'VM' ? c[6] : c[1] !== 'in' ? c[2] : '';
    if(a && !last[a]) last[a] = c[0];
    if(c[10] === 'fwd_ok' || c[10] === 'fwd_no'){ const p = c[9], n = p.length ? p[p.length - 1][0] : ''; if(!n) continue;
      const f = fw[n] ||= {ok: 0, no: 0, last: ''}; f[c[10] === 'fwd_ok' ? 'ok' : 'no']++; if(c[0] > f.last) f.last = c[0]; } }
  const rows = [];
  FULL.extensions.forEach(e => {
    const per = {};
    e.profiles.forEach(p => p.routes.forEach(([k, d]) => { if(!d || d.to !== 'External' || !d.ext) return; const x = per[normNum(d.ext) || d.ext] ||= {raw: d.ext, st: new Set(), conds: new Set()};
      x.st.add(FWD_ST[p.name] || p.name); const t = k.split(' › ').slice(1); x.conds.add(t.join(' ')); }));
    const ring = e.profiles.filter(p => p.ringMobile === 'True' || p.ringMobile === '1').map(p => FWD_ST[p.name] || p.name);
    Object.entries(per).forEach(([k, x]) => {
      const others = (mob[k] || []).filter(n => n !== e.number), own = normNum(e.mobile) && normNum(e.mobile) === k;
      const curLab = FWD_ST[e.profile] || e.profile, active = x.st.has(curLab), lastAct = last[e.number] || '';
      const flags = [];
      if(e.enabled === false) flags.push('disabled');
      else if(!lastAct || lastAct < lim30) flags.push('inactive');
      if(own) flags.push('own'); else if(others.length) flags.push('other'); else flags.push('unknown');
      rows.push({e, num: k, raw: x.raw, st: [...x.st], conds: [...x.conds], active, cur: curLab, ring, others, own, flags, lastAct, f: fw[e.number] || {ok: 0, no: 0, last: ''}, seg: SEGOF[e.number] || SEG_COMMON});
    });
  });
  const ord = Object.values(FWD_ST); rows.forEach(r => r.st.sort((a, b) => (ord.indexOf(a) + 1 || 99) - (ord.indexOf(b) + 1 || 99)));
  return RX_CACHE = {rows, end, ringOnly: FULL.extensions.filter(e => !rows.some(r => r.e === e) && e.profiles.some(p => p.ringMobile === 'True' || p.ringMobile === '1'))};
}

    const K = HX_KIND[m[2]] || [m[2], m[2], m[2]], o = `« ${m[3]} »`;

let LIC2_BASE = null;
function lic2Base(){
  if(LIC2_BASE) return LIC2_BASE;
  const L = licAnalysis();
  // téléphones vus : adresse MAC annoncée dans les rapports de qualité d'appel (dernière date)
  const seen = {}; (FULL.phoneUA || []).forEach(([mac, , , t]) => { if(!seen[mac] || t > seen[mac]) seen[mac] = t; });
  // touches BLF des collègues qui surveillent ce poste
  const blfBy = {}; FULL.extensions.forEach(e => (e.blfs || []).forEach(b => { if(b.type === 'BLF' && b.v && b.v !== e.number) (blfBy[b.v] ||= new Set()).add(e.number); }));
  const refs = dnRefs();
  L.rows.forEach(r => { const rf = refs[r.ext] || [];
    r.route = rf.filter(x => x.cat !== 'member').length; r.member = rf.filter(x => x.cat === 'member').length; r.blfBy = [...(blfBy[r.ext] || [])];
    r.devs = r.e.devices.map(d => { const mac = (d.mac || '').toUpperCase(); return {d, mac, seen: seen[mac] || null}; }); });
  return LIC2_BASE = {L, quality: Object.keys(seen).length > 0};
}
function lic2Rows(days){
  const {L, quality} = lic2Base(), lim = new Date(Date.parse(L.histEnd) - days * 864e5).toISOString();
  return L.rows.map(r => {
    const rs = [], inactive = !r.last || r.last < lim;
    if(!r.last) rs.push('never'); else if(r.last < lim) rs.push('idle');
    if((inactive || !r.e.enabled) && (r.route || r.e.queues.length || r.e.ringGroups.length || r.blfBy.length)) rs.push('used'); // l'appartenance à un département seule ne compte pas
    if(r.e.enabled && !r.devs.length) rs.push('noPhone');
    if(quality && r.devs.length && r.devs.every(x => !x.seen)) rs.push('unseen');
    r.reasons.filter(k => !['never', 'idle'].includes(k)).forEach(k => rs.push(k));
    return {...r, inactive, why: rs};
  });
}

];
const setCat = k => SET_CATS.find(([p]) => k === p || k.startsWith(p));
function setKeys(){ const out = []; try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(setCat(k)) out.push(k); } }catch(e){} return out.sort(); }
const setDesc = k => { const c = setCat(k); const extra = k.slice(c[0].length); return extra ? `${c[1]} — ${extra.replace(/\|/, ' · backup du ')}` : c[1]; };
function setCount(k, v){ try{ const j = JSON.parse(v);
  if(k.startsWith('suivi3cx:')) return `${j.length} point${j.length > 1 ? 's' : ''}`;
  if(k.startsWith('notes3cx:')) return `${Object.keys(j.status || {}).length} statuts, ${Object.keys(j.text || {}).length} notes, ${(j.custom || []).length} observations`;
  if(k.startsWith('actions3cx:')) return `${Object.keys(j.done || {}).length} tâches faites`;
  if(k.startsWith('rappels3cx:')) return `${Object.keys(j).length} clients traités`;
  if(k.startsWith('seg3cx:')) return `${Object.keys(j.names || {}).length} noms, ${Object.keys(j.overrides || {}).length} corrections`;
  if(k.startsWith('objectifs3cx:')) return `${Object.keys(j.seg || {}).length} magasin(s) avec objectifs propres`;
  if(k.startsWith('rapport3cx-sections')) return `${j.length} sections cochées`;
  if(k.startsWith('stats3cx-periode')) return ({'7': '7 derniers jours', '30': '30 derniers jours', '90': '90 derniers jours', all: 'tout l\'historique', custom: `du ${j.from} au ${j.to}`})[j.mode] || j.mode;
}catch(e){}
  if(k.startsWith('segsel3cx:')) return v ? segShort(v) : 'Tous les magasins';
  if(k === 'nav3cx') return v === 'mini' ? 'réduit' : 'déplié';

if(!window.__runBatch){
  window.__runBatch = async (stores, orig) => {
    const ov = document.createElement('div'); ov.className = 'batchov'; document.body.appendChild(ov);
    const items = [];
    try{
      for(let i = 0; i < stores.length; i++){
        ov.innerHTML = `<div class="card"><b>Génération des rapports…</b><div class="muted">${i + 1} / ${stores.length}</div><div class="acpb" style="margin-top:8px"><span style="width:${100 * i / stores.length}%"></span></div></div>`;
        await new Promise(r => setTimeout(r, 30));
        if(location.hash.split('/')[0] !== '#rapport') history.replaceState(null, '', '#rapport');
        window.__app.setSeg(stores[i]);
        const rep = document.getElementById('report');
        if(rep) items.push({seg: stores[i], name: (document.querySelector('.rpcover h1') || {}).textContent || stores[i], html: rep.innerHTML});
      }
    } finally {
      window.__batchResult = {at: new Date().toISOString(), items};
      window.__app.setSeg(orig || '');
      ov.remove();
    }
  };
  window.__printBatch = () => {
    const R = window.__batchResult; if(!R) return;
    const box = document.createElement('div'); box.id = 'batchprint';
    box.innerHTML = R.items.map(x => `<article class="report batchrep">${x.html}</article>`).join('');
    document.body.appendChild(box); document.body.classList.add('printing-batch');
    window.print();
    setTimeout(() => { box.remove(); document.body.classList.remove('printing-batch'); }, 800);
  };
}
