      <td class="num">${(a.pa + a.pe) ? pc(a.pa / (a.pa + a.pe)) : '–'}</td><td class="num">${nf(a.pe)}</td></tr>`)))}
  ${sect('postes', 'Postes', T(['Poste', 'Nom', 'Courriel', 'Téléphone', 'Files'], D.extensions.slice().sort((a, b) => a.number.localeCompare(b.number)).map(e => `<tr><td class="mono">${esc(e.number)}</td><td>${esc((e.first + ' ' + e.last).trim())}</td><td>${esc(e.email)}</td>
      <td>${esc(e.devices.map(d => d.model || d.template).join(', ') || '—')}</td><td>${esc(e.queues.join(', '))}</td></tr>`)))}
  ${sect('tel', 'Téléphones à mettre à jour', `<p>${phTodo.length} téléphone${phTodo.length > 1 ? 's' : ''} sur ${ph.length} : firmware plus ancien que la version recommandée par 3CX, ou version inconnue (aucun firmware assigné et aucun indice). À traiter depuis la console 3CX : Téléphones → Mettre à jour le firmware.</p>` +
      T(['Poste', 'Modèle', 'MAC', 'État', 'Recommandé 3CX'], phTodo.map(r => `<tr><td>${esc(r.ext + ' ' + r.user)}</td><td>${esc(r.model)}</td><td class="mono">${esc(macFmt(r.mac))}</td><td>${PH_ST[r.st].l}</td><td class="mono">${esc(r.rec || '—')}</td></tr>`)))}
  <footer class="rpfoot">Généré par 3CXplore — données issues du backup du ${esc(FULL.info.date)}.</footer>`;
};

// ---------- Liste d'actions pour la console 3CX ----------
const ACT_WHEN = {now: {l: 'Tout de suite', c: 'bad', o: 0}, evening: {l: 'Hors des heures d\'ouverture', c: 'warn', o: 1}, plan: {l: 'À planifier', c: 'acc', o: 2}};
const ACT_KEY = () => 'actions3cx:' + (FULL.info.fqdn || '') + '|' + (FULL.info.date || '');
function actState(){ try{ return JSON.parse(localStorage.getItem(ACT_KEY()) || '{}'); }catch(e){ return {}; } }
function actSave(s){ try{ localStorage.setItem(ACT_KEY(), JSON.stringify(s)); }catch(e){} }
function copyText(t){
  const fb = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fb); else fb();
}
function buildActions(){
  const A = [];
  const add = t => A.push({items: [], copy: '', ...t});
  const F = analyse(), byId = id => F.find(f => f.id === id);
  const today = new Date().toLocaleDateString('fr-CA'), in7 = new Date(Date.now() + 7 * 864e5).toLocaleDateString('fr-CA');
  // 1) acheminement cassé ou absent
  const un = byId('unrouted');
  if(un) add({id: 'unrouted', when: 'now', cat: 'Acheminement', title: `Donner une destination à ${un.items.length} SDA non acheminé${un.items.length > 1 ? 's' : ''}`,
    path: 'Console 3CX → section des trunks (Voice & Chat / SIP Trunks) → trunk concerné → règles entrantes (Inbound rules) : créer une règle pour le SDA, ou donner une destination à la règle par défaut du trunk',
    impact: 'Aucun : les appels reçus sur ces numéros ne mènent actuellement nulle part.', why: un.detail, items: un.items, copy: un.items.map(i => i.text).join('\n')});
  const dn = byId('dept-noroute');
  if(dn) add({id: 'dept-noroute', when: 'now', cat: 'Acheminement', title: `Définir l'acheminement de ${dn.items.length} département${dn.items.length > 1 ? 's qui reçoivent' : ' qui reçoit'} des SDA`,
    path: 'Console 3CX → Départements (Departments) → département → Heures de bureau (Office hours) → destinations « ouvert » et « fermé »', impact: 'Aucun.', why: dn.detail, items: dn.items});
  const br = byId('broken');
  if(br) add({id: 'broken', when: 'now', cat: 'Acheminement', title: `Corriger ${br.items.length} destination${br.items.length > 1 ? 's' : ''} vers un élément inexistant`,
    path: 'Console 3CX → élément d\'origine (SDA, département, IVR, file) → destination', impact: 'Aucun.', why: br.detail, items: br.items});
  const qe = byId('q-empty');
  if(qe) add({id: 'q-empty', when: 'now', cat: "Files d'attente", title: `Ajouter des agents à ${qe.items.length} file${qe.items.length > 1 ? 's' : ''} sans agent`,
    path: 'Console 3CX → Files d\'attente (Call Queues) → file → Agents → Ajouter', impact: 'Aucun.', why: qe.detail, items: qe.items});
  if(FULL.calls.length){
    const last = localParts(FULL.calls[0][0])[0], miss = missedAnalysis(addDaysISO(last, -6), last).filter(r => r.st === 'todo');
    if(miss.length) add({id: 'rappels', when: 'now', cat: 'Clients', title: `Rappeler ${miss.length} client${miss.length > 1 ? 's' : ''} sans réponse (7 derniers jours)`,
      path: 'Onglet « Appels manqués » de l\'interface : liste de rappel par magasin (imprimable, export CSV)', impact: 'Aucun sur le système : action de la réception.',
      why: 'Ces clients ont appelé, n\'ont pas obtenu de réponse et n\'ont pas été rappelés depuis.',
      items: miss.sort((a, b) => b.n - a.n).slice(0, 60).map(r => ({html: `<span class="mono">${esc(phone(r.num))}</span> <span class="muted">${esc(segShort(r.seg))} · ${r.n} tentative${r.n > 1 ? 's' : ''}</span>`, text: `${phone(r.num)} ${segShort(r.seg)}`})),
      copy: miss.map(r => phone(r.num)).join('\n')});
  }
  // 2) jours fériés manquants (90 prochains jours), par département
  if(FULL.calls.length){
    const last = localParts(FULL.calls[0][0])[0], d30 = (() => { const x = new Date(last + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() - 29); return x.toISOString().slice(0, 10); })();
    const H = hoursAnalysis(d30, last).filter(r => r.missingHol.length);
    if(H.length){
      const soon = H.some(r => r.missingHol.some(([, d]) => d <= in7));
      const hols = [...new Set(H.flatMap(r => r.missingHol.map(([n, d]) => `${n} (${d})`)))];
      add({id: 'holidays', when: soon ? 'now' : 'plan', cat: 'Horaires', title: `Ajouter les jours fériés à venir dans ${H.length} département${H.length > 1 ? 's' : ''}`,
        path: 'Console 3CX → Départements (Departments) → département → jours fériés (Holidays) → ajouter chaque date',
        impact: 'Aucun. Sans cela, ces jours-là les appels suivent l\'horaire normal.' + (soon ? ' Un jour férié arrive dans moins de 7 jours.' : ''),
        why: 'Jours fériés à ajouter : ' + hols.join(', ') + '.',
        items: H.map(r => ({html: `${dnLink(r.g.number)} <span class="muted">— ${r.missingHol.map(([n, d]) => esc(n) + ' ' + d.slice(5)).join(', ')}</span>`, text: `${r.g.number} ${r.g.name}`})), copy: hols.join('\n')});
    }
    const hc = byId('hours-closed');
    if(hc) add({id: 'hours-closed', when: 'plan', cat: 'Horaires', title: `Vérifier les horaires de ${hc.items.length} département${hc.items.length > 1 ? 's' : ''} (appels au menu fermé pendant l'ouverture)`,
      path: 'Console 3CX → Départements → département → Heures de bureau et pauses ; vérifier aussi qu\'aucun mode « fermé » n\'a été forcé', impact: 'Aucun.', why: hc.detail, items: hc.items});
  }
  // 3) firmwares : d'abord le serveur, puis les téléphones (par magasin et par modèle)
  const ph = phoneRows(), mods = modelRows(ph), srvBad = mods.filter(m => m.st === 'missing' || m.st === 'srvold');
  srvBad.forEach(m => add({id: 'fwsrv:' + m.model, when: 'evening', cat: 'Téléphones', title: `Rendre disponible le firmware ${m.rec.version} pour les ${m.model} (${m.count})`,
    path: 'Console 3CX → Téléphones (Phones) → sélectionner un ' + m.model + ' → Mettre à jour le firmware (Upgrade firmware) : 3CX télécharge le firmware recommandé. En cas d\'échec, téléverser le fichier officiel.',
    impact: 'Préalable : à faire avant la mise à jour des téléphones de ce modèle (tâches suivantes). Seul le téléphone utilisé pour l\'essai redémarre.', why: `Le firmware recommandé par 3CX (${m.rec.file}) n'est pas sur le serveur.`,
    items: m.rec.url ? [{html: `<a class="dlink" href="${esc(m.rec.url)}" target="_blank" rel="noopener">Fichier officiel : ${esc(m.rec.file)}</a>`, text: m.rec.url}] : []}));
  const todo = ph.filter(r => (r.st === 'old' || r.st === 'unk' || r.st === 'prob') && r.rec && r.mac); // modèles de la liste 3CX, avec une MAC
  const groups = {};
  todo.forEach(r => { const k = (r.seg || SEG_COMMON) + '|' + r.model; (groups[k] ||= []).push(r); });
  Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0])).forEach(([k, rows]) => {
    const [seg, model] = k.split('|'), nOld = rows.filter(r => r.st === 'old').length, nUnk = rows.filter(r => r.st === 'unk').length, nProb = rows.filter(r => r.st === 'prob').length;
    const needsSrv = srvBad.some(m => m.model === model);
    add({id: 'fw:' + k, when: 'evening', cat: 'Téléphones', seg, title: `Mettre à jour le firmware de ${rows.length} ${model} — ${segShort(seg)}`,
      path: 'Console 3CX → Téléphones (Phones) → rechercher chaque MAC (bouton « Copier les MAC ») → cocher → Mettre à jour le firmware (Upgrade firmware)',
      impact: 'Les téléphones redémarrent pendant quelques minutes (appels en cours coupés) : le soir ou la fin de semaine.' + (needsSrv ? ' Faire d\'abord l\'étape « Rendre disponible le firmware » de ce modèle.' : ''),
      why: [nOld && `${nOld} avec un firmware plus ancien que la recommandation`, nUnk && `${nUnk} sans firmware assigné et de version inconnue`, nProb && `${nProb} probablement à jour mais dont le firmware assigné a été effacé`].filter(Boolean).join(' ; ') + '.',
      items: rows.sort((a, b) => a.ext.localeCompare(b.ext)).map(r => ({html: `<span class="mono">${esc(macFmt(r.mac))}</span> ${dnLink(r.ext)} <span class="pill ${PH_ST[r.st].c}">${PH_ST[r.st].l}</span>`, text: `${macFmt(r.mac)} ${r.ext} ${r.user}`})),
      copy: rows.map(r => macFmt(r.mac)).join('\n')});
  });
  // 4) autres réglages
  const vm = byId('vm-off');
  if(vm) add({id: 'vm-off', when: 'plan', cat: 'Postes', title: `Activer la messagerie vocale de ${vm.items.length} poste${vm.items.length > 1 ? 's' : ''} (ou changer leur renvoi)`,
    path: 'Console 3CX → Utilisateurs (Users) → poste → Messagerie vocale (Voicemail) → Activer ; ou onglet Renvois (Forwarding rules) du profil actif',
    impact: 'Aucun. Penser à resélectionner le firmware si l\'onglet Téléphone (IP Phone) est modifié.', why: vm.detail, items: vm.items, copy: vm.items.map(i => i.text.split(' ')[0]).join('\n')});
  // 5) actions issues des analyses récentes (6.4 à 6.20)
  const inSegA = n => !SEG || SEGOF[n] === SEG, who = e => `${e.number} ${(e.first + ' ' + e.last).trim()}`;
  const SA = secAnalysis();
  const admNo = SA.elevated.filter(r => (!SEG || r.seg === SEG) && r.rank >= 5 && !['on', 'ms'].includes(r.fa));
  if(admNo.length) add({id: 'mfa-admin', when: 'now', cat: 'Sécurité', title: `Protéger par MFA ${admNo.length} compte${admNo.length > 1 ? 's' : ''} avec accès complet au système`,
    path: 'Console 3CX → Utilisateurs (Users) → utilisateur → relier le compte Microsoft 365 (synchronisation Microsoft 365 / Entra ID) avec la connexion Microsoft active, ou onglet Sécurité → activer la double authentification (2FA)',
    impact: 'Aucun sur les appels. L\'utilisateur devra valider la double authentification à sa prochaine connexion.', why: 'Ces comptes peuvent tout modifier dans le système et se connectent avec un simple mot de passe 3CX.',
    items: admNo.map(r => ({html: `${dnLink(r.e.number)} <span class="muted">${esc(secRole(r.role)[1])} · ${esc(mfaOf(r.e).why)}</span>`, text: who(r.e)})), copy: admNo.map(r => who(r.e)).join('\n')});
  const named = FULL.extensions.filter(e => inSegA(e.number) && e.email && ['off', 'req'].includes(mfaOf(e).k));
  if(named.length) add({id: 'mfa-named', when: 'plan', cat: 'Sécurité', title: `Relier ${named.length} poste${named.length > 1 ? 's' : ''} nominatif${named.length > 1 ? 's' : ''} à Microsoft 365 (MFA)`,
    path: 'Console 3CX → Intégrations → Microsoft 365 → utilisateurs synchronisés : ajouter ces personnes ; ou Utilisateurs → poste → activer la double authentification',
    impact: 'Aucun sur les appels.', why: 'Postes avec un courriel mais sans MFA (non reliés à Microsoft 365, ou connexion Microsoft désactivée).',
    items: named.slice(0, 80).map(e => ({html: `${dnLink(e.number)} <span class="muted">${esc(e.email)} · ${esc(mfaOf(e).why)}</span>`, text: `${who(e)} <${e.email}>`})), copy: named.map(e => e.email).join('\n')});
  if(SA.intl.length && !SA.intlCalls) add({id: 'intl', when: 'plan', cat: 'Sécurité', title: 'Restreindre la règle sortante des appels internationaux',
    path: 'Console 3CX → Règles sortantes (Outbound Rules) → ' + SA.intl.map(o => o.name).join(', ') + ' → limiter aux postes qui en ont besoin (« Appels depuis les postes ») ou désactiver la règle',
    impact: 'Aucun : aucun appel international dans l\'historique.', why: 'Une règle internationale ouverte à tous les postes expose à la fraude téléphonique si un compte est compromis.',
    items: SA.intl.map(o => ({html: `<b>${esc(o.name)}</b> <span class="muted">préfixe ${esc(o.prefix || '—')} · trunk ${esc(o.routes.map(r => r.gw).join(', ') || '—')}</span>`, text: o.name}))});
  const fwdA = SA.fwd.filter(r => (!SEG || r.seg === SEG) && r.active);
  if(fwdA.length) add({id: 'fwd-ext', when: 'plan', cat: 'Sécurité', title: `Vérifier ${fwdA.length} renvoi${fwdA.length > 1 ? 's' : ''} vers des numéros externes`,
    path: 'Console 3CX → Utilisateurs → poste → Renvois (Forwarding rules) → profil actif',
    impact: 'Aucun si le renvoi est conservé.', why: 'Chaque renvoi externe fait sortir des appels de clients et utilise une ligne : vérifier que ces numéros sont connus et toujours utiles.',
    items: fwdA.map(r => ({html: `${dnLink(r.e.number)} <span class="mono">${esc(r.nums.map(phone).join(', '))}</span> <span class="muted">profil ${esc(r.current)}</span>`, text: `${who(r.e)} → ${r.nums.map(phone).join(', ')}`}))});
  const C6 = ctlRun(), hangs = C6.causes.filter(x => x.key[0] === 'I');
  if(hangs.length) add({id: 'ivr-hang', when: 'plan', cat: 'Menus', title: `Revoir ${hangs.length} menu${hangs.length > 1 ? 's' : ''} qui raccroche${hangs.length > 1 ? 'nt' : ''} quand le client ne choisit rien`,
    path: 'Console 3CX → Standards (Digital Receptionists / IVR) → menu → « Si aucune touche n\'est faite » (Timeout) : renvoyer vers la messagerie ou répéter le message plutôt que raccrocher',
    impact: 'Aucun pendant la modification.', why: 'Dans ces menus (souvent ceux de fermeture), un client qui n\'appuie sur aucune touche est raccroché. Vérifier au moins que le message invite à choisir une option.',
    items: hangs.map(x => { const dn = (x.detail || '').split(' ')[0]; return {html: `${dnLink(dn)} <span class="muted">${x.dids.size} SDA · ${esc([...x.moments].join(', '))}</span>`, text: x.detail}; })});
  const qOff = FULL.queues.filter(q => inSegA(q.number) && q.members.length && !q.members.some(m => !m.status || m.status === 'LoggedIn'));
  if(qOff.length) add({id: 'q-off', when: 'now', cat: "Files d'attente", title: `Connecter au moins un agent dans ${qOff.length} file${qOff.length > 1 ? 's' : ''}`,
    path: 'Application 3CX de l\'agent → statut de file → se connecter à la file ; ou Console 3CX → Files d\'attente → file → Agents',
    impact: 'Aucun.', why: 'Des agents sont membres de ces files, mais aucun n\'est connecté : les appels attendent puis débordent.',
    items: qOff.map(q => ({html: `${dnLink(q.number)} <span class="muted">${q.members.length} membre(s) : ${esc(q.members.map(m => m.dn).join(', '))}</span>`, text: `${q.number} ${q.name}`}))});
  const IDa = indispAnalysis(), solo = IDa.risky.filter(x => x.kind === "File d'attente" && x.on === 1 && x.calls >= 50);
  if(solo.length) add({id: 'q-backup', when: 'plan', cat: "Files d'attente", title: `Ajouter un remplaçant dans ${solo.length} file${solo.length > 1 ? 's' : ''} qui repose${solo.length > 1 ? 'nt' : ''} sur une seule personne`,
    path: 'Console 3CX → Files d\'attente (Call Queues) → file → Agents → Ajouter un agent de relève',
    impact: 'Aucun.', why: 'Une seule personne connectée répond à ces files : son absence ou un appel en cours fait déborder ou perdre les appels.',
    items: solo.map(x => ({html: `${dnLink(x.dn)} <span class="muted">${nf(x.calls)} appels (30 j) · connectée : ${esc(x.onList.join(', '))}</span>`, text: `${x.dn} ${x.name}`}))});
  const effQ = FULL.queues.filter(q => inSegA(q.number)).map(q => { const E = effAnalysis(new Set([q.number]), 8), sl = E.G.flatMap((r, wd) => r.map((c, h) => ({c, wd, h}))).filter(x => x.c.st === 'bad');
    return {q, sl, ab: sl.reduce((a, x) => a + x.c.ab, 0)}; }).filter(x => x.ab * 30 / 56 >= 10).sort((a, b) => b.ab - a.ab);
  if(effQ.length) add({id: 'staff', when: 'plan', cat: 'Effectif', title: `Renforcer ${effQ.length} file${effQ.length > 1 ? 's' : ''} aux heures où les clients raccrochent`,
    path: 'Horaires des agents (hors console) ; pour ajouter des agents : Console 3CX → Files d\'attente → file → Agents',
    impact: 'Aucun.', why: 'Sur ces créneaux, 30 % ou plus des clients raccrochent en attente, ou il manque des agents (onglet Effectif).',
    items: effQ.map(x => ({html: `${dnLink(x.q.number)} <span class="muted">≈ ${nf(Math.round(x.ab * 30 / 56))} abandons / mois · ${esc(x.sl.sort((a, b) => b.c.ab - a.c.ab).slice(0, 3).map(s => EFF_DAYS[s.wd] + ' ' + s.h + ' h').join(', '))}</span>`, text: `${x.q.number} ${x.q.name}`}))});
  return A.sort((a, b) => ACT_WHEN[a.when].o - ACT_WHEN[b.when].o);
}

V.actions = el => {

    <div class="bar"><select id="acw"><option value="">Tous les moments</option>${Object.entries(ACT_WHEN).map(([k, v]) => `<option value="${k}">${v.l}</option>`).join('')}</select>

      return head + `<div class="card acard${S.done[t.id] ? ' done' : ''}" data-id="${esc(t.id)}">
        <div class="ach"><label class="accb"><input type="checkbox" data-id="${esc(t.id)}"${S.done[t.id] ? ' checked' : ''}><span class="acn">${A.indexOf(t) + 1}</span></label>
          <div class="act"><div class="actt">${esc(t.title)}</div><div class="muted" style="font-size:12px"><span class="pill">${esc(t.cat)}</span>${t.seg ? `<span class="pill">${esc(segShort(t.seg))}</span>` : ''}</div></div></div>

const SUIVI_V = 1;
const SUIVI_KEY = fq => 'suivi3cx:' + (fq || '');
function suiviLoad(fq){ try{ const a = JSON.parse(localStorage.getItem(SUIVI_KEY(fq)) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function suiviSave(fq, arr){ try{ localStorage.setItem(SUIVI_KEY(fq), JSON.stringify(arr)); return true; }catch(e){ return false; } }
function suiviUpsert(snap){ const a = suiviLoad(snap.fqdn).filter(s => s.id !== snap.id); a.push(snap); a.sort((x, y) => (x.iso || '') < (y.iso || '') ? -1 : 1); return suiviSave(snap.fqdn, a); }
const addDaysISO = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };

// calcul d'un point à partir de n'importe quel backup (le rattachement aux magasins suit l'attribution actuelle)
function computeSnapshot(X){
  const segX = n => SEGOF[n] || SEG_COMMON;
  const didSeg = {}, unrouted = [];
  X.lines.forEach(l => { const by = {}; l.rules.forEach(r => by[r.data] = r); const def = l.rules.find(r => r.cond === 'ForwardAll');
    l.dids.forEach(d => { const r = by[d] || def, dn = r?.office?.dn;
      didSeg[d] = dn && SEGOF[dn] ? SEGOF[dn] : (r?.office?.to === 'External' ? SEG_BRIDGE : SEG_COMMON);
      if(!r || !r.office || ['None', 'ProceedWithNoExceptions'].includes(r.office.to)) unrouted.push(d); }); });
  const M = {}, S = k => M[k] ||= {postes: 0, tels: 0, files: 0, sda: 0, inc: 0, ans: 0, lost: 0, base: 0, qs: 0, qw: 0, pa: 0, pe: 0, phOk: 0, phUnk: 0, phOld: 0, phProb: 0, unrouted: 0, holMissing: 0};
  const both = (s, f) => { f(S('')); if(s) f(S(s)); };
  // téléphones : même logique que l'onglet Téléphones (firmware assigné, version vue, firmware effacé)
  const ua = {}; (X.phoneUA || []).forEach(u => ua[u[0]] = u); const er = {}; (X.fwErased || []).forEach(e => er[e[0]] = e);
  const phSt = d => { const rec = recFor(d.model), t = rec ? rec.version : null, mac = (d.mac || '').toUpperCase(), cmp = v => t ? verCmp(v, t) : 0;
    if(d.firmware) return cmp(fwVersion(d.firmware)) < 0 ? 'Old' : 'Ok';
    if(ua[mac]) return cmp(ua[mac][2]) < 0 ? 'Old' : 'Ok';
    if(er[mac]) return cmp(fwVersion(er[mac][1])) < 0 ? 'Old' : 'Prob';
    return 'Unk'; };
  X.extensions.forEach(e => { const s = segX(e.number); both(s, m => m.postes++);
    e.devices.forEach(d => { if(!d.mac && !recFor(d.model)) return; const st = phSt(d); both(s, m => { m.tels++; m['ph' + st]++; }); }); });
  X.queues.forEach(q => both(segX(q.number), m => m.files++));
  Object.entries(didSeg).forEach(([d, s]) => both(s, m => m.sda++)); unrouted.forEach(d => both(didSeg[d], m => m.unrouted++));
  // service : 30 derniers jours de l'historique de ce backup
  let from = '', to = '';
  if(X.calls.length){
    to = localParts(X.calls[0][0])[0]; from = addDaysISO(to, -29);
    X.calls.forEach(c => { if(c[1] !== 'in') return; const day = localParts(c[0])[0]; if(day < from) return;
      let s = didSeg[c[5]]; if(!s || s === SEG_COMMON){ const p = c[9].find(x => SEGOF[x[0]] && SEGOF[x[0]] !== SEG_COMMON); s = p ? SEGOF[p[0]] : (s || SEG_COMMON); }
      both(s, m => { m.inc++; if(c[10] !== 'bridge') m.base++; if(c[10] === 'ans' || c[10] === 'fwd_ok') m.ans++; else if(ST_LOST.has(c[10])) m.lost++; }); });
    (X.queueCalls || []).forEach(r => { if(!r[6] || localParts(r[0])[0] < from) return; both(segX(r[1]), m => { m.qs++; m.qw += r[4]; }); });
    if(X.agentPolls) Object.entries(X.agentPolls).forEach(([k, v]) => { const [d, , a] = k.split('|'); if(d < from) return; both(segX(a), m => { m.pa += v[0]; m.pe += v[1]; }); });
  }
  // jours fériés du Québec des 90 jours suivant la date du backup, absents des départements
  const bIso = backupDateISO(X.info.date), bDay = (bIso || new Date().toISOString()).slice(0, 10), lim = addDaysISO(bDay, 90), y = +bDay.slice(0, 4);
  const upcoming = [...qcHolidays(y), ...qcHolidays(y + 1)].filter(([, d]) => d >= bDay && d <= lim).map(x => x[1]);
  const hasDetail = X.groups.some(g => Array.isArray(g.holidayDates));
  if(hasDetail) X.groups.filter(g => !isSysGroup(g) && g.members.length && g.hours?.type !== 'AllHours' && g.routes && g.routes.office && g.routes.office.to !== 'None').forEach(g => {
    const hol = g.holidayDates || [];
    const isHol = day => hol.some(h => { const [yy, mm, dd] = day.split('-').map(Number); const key = h.recurrent ? mm * 100 + dd : yy * 10000 + mm * 100 + dd;
      const a = h.recurrent ? h.m * 100 + h.d : h.y * 10000 + h.m * 100 + h.d, b = h.recurrent ? h.me * 100 + h.de : h.ye * 10000 + h.me * 100 + h.de; return key >= a && key <= b; });
    if(upcoming.some(d => !isHol(d))) both(segX(g.number), m => m.holMissing++); });
  const out = {};
  Object.entries(M).forEach(([k, m]) => out[k] = {postes: m.postes, tels: m.tels, files: m.files, sda: m.sda, inc: m.inc,
    rate: m.base ? Math.round(1000 * m.ans / m.base) / 10 : null, lost: m.lost, lostRate: m.base ? Math.round(1000 * m.lost / m.base) / 10 : null,
    wait: m.qs ? Math.round(m.qw / m.qs) : null, qRate: (m.pa + m.pe) ? Math.round(1000 * m.pa / (m.pa + m.pe)) / 10 : null,
    phOk: m.phOk, phUnk: m.phUnk, phOld: m.phOld, phProb: m.phProb, unrouted: m.unrouted, holMissing: hasDetail ? m.holMissing : null});
  return {v: SUIVI_V, id: (X.info.fqdn || '') + '|' + X.info.date, fqdn: X.info.fqdn || '', company: X.info.company, date: X.info.date, iso: bIso,
    name: X.source?.name || '', savedAt: new Date().toISOString(), period: [from, to], m: out};
}

const normNum = s => { const d = String(s || '').replace(/\D/g, ''); return d.length >= 10 ? d.slice(-10) : ''; };
const RAP_KEY = () => 'rappels3cx:' + (FULL.info.fqdn || '') + '|' + (FULL.info.date || '');
const LOST_WHERE = {q_ab: 'Abandon en file', ivr_ab: 'Raccroché au menu', miss: 'Non répondu', fwd_no: 'Renvoi externe sans réponse', park_ab: 'Raccroché en parking'};
const RAP_ST = {todo: {l: 'Non rappelé', c: 'bad'}, back: {l: 'Rappelé', c: 'ok'}, self: {l: 'A rappelé et a été servi', c: 'acc'}};
// analyse sur tout l'historique, période appliquée sur la date du dernier appel manqué
function missedAnalysis(from, to){
  const all = FULL.calls, n = all.length, meta = all.map(c => localParts(c[0])[0]);
  // index des événements par numéro client : rappels sortants et appels entrants servis
  const outBy = {}, servedBy = {};
  for(let i = 0; i < n; i++){ const c = all[i];
    if(c[1] === 'out'){ const k = normNum(c[4]); if(k) (outBy[k] ||= []).push(i); }
    else if(c[1] === 'in' && (c[10] === 'ans' || c[10] === 'fwd_ok' || c[10] === 'vm')){ const k = normNum(c[2]); if(k) (servedBy[k] ||= []).push(i); } }
  const groups = {};
  for(let i = 0; i < n; i++){ const c = all[i];
    if(c[1] !== 'in' || !ST_LOST.has(c[10])) continue;
    const k = normNum(c[2]); if(!k) continue; // numéros masqués ou internes ignorés
    const s = callSeg(c), g = groups[s + '|' + k] ||= {num: k, raw: c[2], name: '', seg: s, lost: [], did: c[5]};
    g.lost.push(i); if(c[3] && normNum(c[3]) !== k) g.name = c[3]; }
  const rows = [];
  Object.values(groups).forEach(g => {
    const lastI = g.lost.reduce((a, b) => all[a][0] > all[b][0] ? a : b), last = all[lastI];
    if(meta[lastI] < from || meta[lastI] > to) return;
    const after = i => all[i][0] > last[0];
    const back = (outBy[g.num] || []).filter(after).sort((a, b) => all[a][0] < all[b][0] ? -1 : 1)[0];
    const self = (servedBy[g.num] || []).filter(after).sort((a, b) => all[a][0] < all[b][0] ? -1 : 1)[0];
    let st = 'todo', when = null, by = '';
    if(back !== undefined && (self === undefined || all[back][0] <= all[self][0])){ st = 'back'; when = all[back][0]; by = all[back][2]; }
    else if(self !== undefined){ st = 'self'; when = all[self][0]; by = all[self][6]; }
    const p = last[9], lastEl = p.length ? p[p.length - 1] : null;
    rows.push({...g, n: g.lost.length, first: all[g.lost.reduce((a, b) => all[a][0] < all[b][0] ? a : b)][0], last: last[0], where: LOST_WHERE[last[10]] || last[10],
      at: lastEl ? lastEl[0] : '', atName: lastEl ? dnName(lastEl[0]) : '', st, when, by, delay: when ? Math.round((Date.parse(when) - Date.parse(last[0])) / 60000) : null,
      attempts: g.lost.map(i => all[i][0]).sort()});
  });
  return rows;
}

// ---------- Parcours dans les menus (IVR) ----------
const ANS_ST = new Set(['ans', 'fwd_ok']);
function ivrAnalysis(from, to){
  const all = FULL.calls, ivrSet = new Set(D.ivrs.map(i => i.number)), R = {};
  D.ivrs.forEach(i => {
    const keysOf = {}; i.options.forEach(o => { const k = o.dn || ('ext:' + o.data) || o.type; (keysOf[k] ||= []).push(o.key); });
    R[i.number] = {ivr: i, keysOf, n: 0, hang: 0, hangDur: [], timeout: 0, choices: {}, other: 0};
  });
  const loss = {};
  all.forEach(c => {
    if(c[1] !== 'in') return; const day = localParts(c[0])[0]; if(day < from || day > to) return;
    const p = c[9];
    p.forEach((x, k) => {
      if(x[1] !== 'ivr' || !ivrSet.has(x[0])) return;
      const r = R[x[0]]; r.n++;
      const next = p[k + 1];
      if(!next){ if(c[10] === 'ivr_ab' || c[10] === 'miss'){ r.hang++; r.hangDur.push(c[7]); } else r.other++; return; }
      const dest = next[0], keys = r.keysOf[dest];
      if(keys){ const ch = r.choices[dest] ||= {dest, keys, n: 0, ans: 0, lost: 0, vm: 0}; ch.n++; if(ANS_ST.has(c[10])) ch.ans++; else if(ST_LOST.has(c[10])) ch.lost++; else if(c[10] === 'vm') ch.vm++; }
      else if(dest === r.ivr.timeoutDN){ r.timeout++; const ch = r.choices['__to'] ||= {dest, keys: ['sans choix'], n: 0, ans: 0, lost: 0, vm: 0, timeout: true}; ch.n++; if(ANS_ST.has(c[10])) ch.ans++; else if(ST_LOST.has(c[10])) ch.lost++; }
      else r.other++;
    });
    // point de perte : dernier élément du parcours d'un appel perdu
    if(ST_LOST.has(c[10]) && (!SEG || callSeg(c) === SEG)){ const last = p[p.length - 1]; const k = last ? last[0] : '(avant tout élément)'; const L = loss[k] ||= {dn: k, type: last ? last[1] : '', n: 0, cause: {}}; L.n++; L.cause[c[10]] = (L.cause[c[10]] || 0) + 1; }
  });
  return {ivrs: Object.values(R).filter(r => r.n).sort((a, b) => b.n - a.n), loss: Object.values(loss).sort((a, b) => b.n - a.n)};
}
const median = a => { if(!a.length) return null; const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };

        <td class="num">${nf(r.n)}</td><td class="num"><span class="pill ${hr > 0.25 ? 'bad' : hr > 0.12 ? 'warn' : 'ok'}">${pct(r.hang, r.n)}</span> <span class="muted">${nf(r.hang)}</span></td>
        <td class="num">${median(r.hangDur) == null ? '–' : dur(median(r.hangDur))}</td><td class="num">${r.timeout ? `${pct(r.timeout, r.n)} <span class="muted">${nf(r.timeout)}</span>` : '–'}</td>
        <td>${t ? `<span class="pill">Touche ${esc(t.keys.join(' / '))}</span> ${esc(dnName(t.dest) || t.dest)} <span class="muted">${pct(t.n, r.n)}</span>` : '–'}</td>

// ---------- Objectifs par magasin ----------
const OBJ_DEF0 = {rate: 85, lostRate: 10, wait: 30, qRate: 85};
const OBJ_META = {rate: {l: 'Taux de réponse', u: '%', dir: 1}, lostRate: {l: 'Appels perdus', u: '%', dir: -1}, wait: {l: 'Attente moyenne en file', u: 's', dir: -1}, qRate: {l: 'Taux de réponse en file (agents)', u: '%', dir: 1}};
const OBJ_KEY = 'objectifs3cx:' + (FULL.info.fqdn || '');
const OBJ = (() => { let c = {}; try{ c = JSON.parse(localStorage.getItem(OBJ_KEY) || '{}'); }catch(e){} return {def: {...OBJ_DEF0, ...(c.def || {})}, seg: c.seg || {}}; })();
const objSave = () => { try{ localStorage.setItem(OBJ_KEY, JSON.stringify(OBJ)); }catch(e){} };
const objNum = v => v === '' || v == null || isNaN(+v) ? null : +v;
// cible d'un indicateur pour un magasin (valeur propre au magasin, sinon valeur par défaut) ; valeurs en % ou en secondes
const objFor = (seg, k) => { const o = seg && OBJ.seg[seg] ? objNum(OBJ.seg[seg][k]) : null; return o != null ? o : objNum(OBJ.def[k]); };
const objOk = (seg, k, v) => { const t = objFor(seg, k); if(t == null || v == null || isNaN(v)) return null; return OBJ_META[k].dir > 0 ? v >= t : v <= t; };
const objCls = (seg, k, v) => { const r = objOk(seg, k, v); return r == null ? '' : r ? 'ok' : 'bad'; };
const objTxt = (seg, k) => { const t = objFor(seg, k); return t == null ? 'aucun objectif' : `objectif ${OBJ_META[k].dir > 0 ? '≥' : '≤'} ${t}${OBJ_META[k].u === '%' ? ' %' : ' s'}`; };
const objPill = (seg, k, v, label) => `<span class="pill ${objCls(seg, k, v)}" title="${esc(objTxt(seg, k))}${objOk(seg, k, v) == null ? '' : objOk(seg, k, v) ? ' — atteint' : ' — non atteint'}">${label}</span>`;
// valeurs actuelles (période donnée) par magasin, pour les quatre indicateurs
function objCurrent(from, to){
  const M = {}, S = k => M[k] ||= {ans: 0, lost: 0, base: 0, qs: 0, qw: 0, pa: 0, pe: 0};
  FULL.calls.forEach(c => { if(c[1] !== 'in') return; const d = localParts(c[0])[0]; if(d < from || d > to) return; const s = callSeg(c);
    [S(''), S(s)].forEach(m => { if(c[10] !== 'bridge') m.base++; if(ANS_ST.has(c[10])) m.ans++; else if(ST_LOST.has(c[10])) m.lost++; }); });
  FULL.queueCalls.forEach(r => { if(!r[6]) return; const d = localParts(r[0])[0]; if(d < from || d > to) return; [S(''), S(SEGOF[r[1]] || SEG_COMMON)].forEach(m => { m.qs++; m.qw += r[4]; }); });
  if(FULL.agentPolls) Object.entries(FULL.agentPolls).forEach(([k, v]) => { const [d, , a] = k.split('|'); if(d < from || d > to) return; [S(''), S(SEGOF[a] || SEG_COMMON)].forEach(m => { m.pa += v[0]; m.pe += v[1]; }); });
  const out = {}; Object.entries(M).forEach(([k, m]) => out[k] = {rate: m.base ? 100 * m.ans / m.base : null, lostRate: m.base ? 100 * m.lost / m.base : null, wait: m.qs ? m.qw / m.qs : null, qRate: (m.pa + m.pe) ? 100 * m.pa / (m.pa + m.pe) : null});
  return out;
}

V.objectifs = el => {
  const all = FULL.calls;
  const lastDay = all.length ? localParts(all[0][0])[0] : '', from = lastDay ? addDaysISO(lastDay, -29) : '';
  const cur = lastDay ? objCurrent(from, lastDay) : {};
  const segs = SEG_LIST.filter(s => s !== SEG_BRIDGE);
  const fmt = (k, v) => v == null ? '–' : OBJ_META[k].u === '%' ? Math.round(v) + ' %' : dur(Math.round(v));
  const inp = (seg, k) => { const own = seg ? (OBJ.seg[seg] || {})[k] : OBJ.def[k]; return `<input type="number" class="objin" data-s="${esc(seg)}" data-k="${k}" value="${own ?? ''}" placeholder="${seg ? esc(String(objNum(OBJ.def[k]) ?? '')) : ''}" min="0" step="1">`; };

const LIC_REASONS = {never: {l: 'Jamais utilisé', c: 'bad'}, idle: {l: 'Inactif depuis plus de 60 jours', c: 'warn'}, dupName: {l: 'Nom en double', c: 'warn'}, dupMail: {l: 'Courriel en double', c: 'warn'},

  FULL.extensions.forEach(e => { const n = nm(e); if(n) (byName[n] ||= []).push(e.number); const m = (e.email || '').toLowerCase().trim(); if(m) (byMail[m] ||= []).push(e.number); });
  const rows = FULL.extensions.map(e => {
    const r = [];
    if(!last[e.number]) r.push('never'); else if(last[e.number] < lim60) r.push('idle');
    if((byName[nm(e)] || []).length > 1) r.push('dupName');
    const m = (e.email || '').toLowerCase().trim(); if(m && byMail[m].length > 1) r.push('dupMail');
    if(/vacant|libre|test|temp|demo|formation|modele|modèle/i.test(e.first + ' ' + e.last)) r.push('vacant');
    if(!e.enabled) r.push('disabled');
    return {e, ext: e.number, name: (e.first + ' ' + e.last).trim(), seg: SEGOF[e.number] || SEG_COMMON, last: last[e.number] || null, reasons: r,
      twins: [...new Set([...(byName[nm(e)] || []), ...(m ? byMail[m] : [])])].filter(x => x !== e.number)};

  const peak = (from) => { const ev = []; all.forEach(c => { if(c[1] === 'int' || c[0] < from) return; const s = Date.parse(c[0]); ev.push([s, 1], [s + Math.max(1, c[7]) * 1000, -1]); });
    ev.sort((a, b) => a[0] - b[0] || a[1] - b[1]); let cur = 0, mx = 0, at = null; const daily = {};

}

  '45': 'Fichier audio', '46': 'Liste de blocage IP', '59': 'Enregistrement', '81': 'Jour férié', '1009': 'Paramètre système', '1012': 'Microsoft 365', '1017': 'Modèle de téléphone', '86': 'Mise à jour 3CX'};
const modType = a => MOD_TYPES[a[2]] || 'Autre (type ' + a[2] + ')';
const MOD_GNAME = {}; FULL.groups.filter(g => !isSysGroup(g)).forEach(g => { MOD_GNAME[gsNorm(g.name).trim()] = g.number; });
const MOD_EXTNAME = {}; FULL.extensions.forEach(e => { const k = gsNorm((e.first + ' ' + e.last).trim()); if(k) MOD_EXTNAME[k] = e.number; });
let MOD_OBJSTR = null; // pour les fichiers audio : éléments (menus, files, départements…) qui utilisent le fichier
const modObjStr = () => MOD_OBJSTR ||= [...FULL.ivrs, ...FULL.queues, ...FULL.ringGroups, ...FULL.groups.filter(g => !isSysGroup(g)), ...FULL.extensions].map(o => [o.number, gsNorm(JSON.stringify(o))]);
const MOD_STORES = SEG_LIST.filter(s => s[0] !== '@');
const MOD_FULLNAMES = MOD_STORES.filter(c => SEGCFG.names[c]).map(c => [c, gsNorm(SEGCFG.names[c]).trim()]).filter(x => x[1].length > 3);
// magasin(s) concerné(s) par une entrée du journal : numéro de l'objet, nom de département, département d'un jour férié, code ou nom du magasin dans le nom
function auditSegs(a){
  const out = new Set(), name = String(a[4] || ''), add = s => { if(s) out.add(s); };
  name.split(',').forEach(p => { const t = p.trim().split(/[\s/]/)[0]; add(SEGOF[t] || SEGOF[MOD_EXTNAME[gsNorm(p).trim()]]); });
  if(a[2] === '45' && name.length > 4){ const f = gsNorm(name); modObjStr().forEach(([n, j]) => { if(j.includes(f)) add(SEGOF[n]); }); }
  add(SEGOF[MOD_GNAME[gsNorm(name).trim()]]);
  a[6].forEach(c => { if(c[0] === 'Group') add(SEGOF[String(c[1] || c[2]).replace(/"/g, '')]); });
  if(!out.size || [...out].every(s => s === SEG_COMMON)){
    name.split(/[\s_.,\/-]+/).forEach(t => { if(MOD_STORES.includes(t)) add(t); });
    const n = gsNorm(name); MOD_FULLNAMES.forEach(([c, f]) => { if(n.includes(f)) add(c); });
  }
  if(out.size > 1) out.delete(SEG_COMMON);
  if(!out.size) out.add(SEG_COMMON);
  return out;
}
let MOD_CACHE = null;

}

// ---------- Sécurité ----------
const SEC_ROLES = {system_owners: [6, 'Propriétaire du système', 'bad'], system_admins: [5, 'Administrateur du système', 'bad'], group_owners: [4, 'Propriétaire de département', 'warn'],
  managers: [3, 'Gestionnaire', 'warn'], supervisors: [2, 'Superviseur', 'acc'], receptionists: [1, 'Réceptionniste', ''], observers: [1, 'Observateur', '']};
const secRole = r => SEC_ROLES[r] || [0, r, ''];
// MFA d'un poste : 'on' double authentification 3CX ; 'ms' compte relié à Microsoft 365 avec la connexion Microsoft active
// (le MFA est alors imposé par Microsoft) ; 'req' exigée par 3CX mais pas configurée ; 'off' aucun
function mfaOf(e){
  const p = e.props || {}, upn = p.AZURE_UPN || e.azure || '', linked = p.AZURE_AD_USER === '1' || !!upn, ssoOff = p.MS365_DISABLE_SSO === '1';
  if(p.ENABLE_2FA === '1') return {k: 'on', upn, why: 'Double authentification 3CX activée'};
  if(linked && !ssoOff) return {k: 'ms', upn, why: 'Connexion par Microsoft 365' + (upn ? ' (' + upn + ')' : '') + ' : MFA géré par Microsoft'};
  const why = linked && ssoOff ? 'Relié à Microsoft 365, mais la connexion Microsoft est désactivée pour ce poste' : 'Non relié à Microsoft 365 et sans double authentification 3CX';
  return {k: p.REQUIRE_2FA === '1' ? 'req' : 'off', upn, why: p.REQUIRE_2FA === '1' ? why + ' (double authentification 3CX exigée, pas encore configurée)' : why, ssoOff: linked && ssoOff};

function indispAnalysis(){
  const end = FULL.queueCalls.length ? FULL.queueCalls[0][0] : (FULL.calls[0] || [])[0] || new Date().toISOString();
  const from = new Date(Date.parse(end) - 30 * 864e5).toISOString(), inSeg = n => !SEG || SEGOF[n] === SEG;
  const qc = {}; FULL.queueCalls.forEach(r => { if(r[0] < from) return; const q = qc[r[1]] ||= {n: 0, served: 0, by: {}}; q.n++; if(r[6]){ q.served++; if(r[7]) q.by[r[7]] = (q.by[r[7]] || 0) + 1; } });
  const rgCalls = {}; FULL.calls.forEach(c => { if(c[0] < from || c[1] !== 'in') return; new Set(c[9].map(p => p[0])).forEach(dn => { rgCalls[dn] = (rgCalls[dn] || 0) + 1; }); });
  const items = [];
  FULL.queues.filter(q => inSeg(q.number)).forEach(q => {

    const top = Object.entries(s.by).sort((a, b) => b[1] - a[1])[0], share = top && s.served ? top[1] / s.served : 0;
    const why = [];

    items.push({kind: "File d'attente", dn: q.number, name: q.name, seg: SEGOF[q.number] || SEG_COMMON, members: q.members.length, on: on.length, onList: on.map(m => m.dn), calls: s.n, served: s.served, top: top ? top[0] : null, share, why, after: q.dest});
  });
  FULL.ringGroups.filter(r => inSeg(r.number)).forEach(r => {
    const why = []; if(!r.members.length) why.push(hasDest(r.dest) ? ['warn', 'Aucun membre : renvoi direct'] : ['bad', 'Aucun membre']); else if(r.members.length === 1) why.push(['warn', 'Un seul membre']);

  });

  return {from, end, items, risky, people, direct};
}

// ---------- Effectif selon l'achalandage (files d'attente) ----------
// Erlang C : probabilité d'attendre avec N agents pour A erlangs de trafic
function erlangC(N, A){ if(N <= A) return 1; let sum = 0, term = 1; for(let k = 0; k < N; k++){ if(k) term *= A / k; sum += term; } const pN = term * A / N * N / (N - A); return pN / (sum + pN); }
// nombre d'agents pour répondre à 80 % des appels en moins de T secondes
function erlangNeed(cph, aht, T, SL = 0.8){ if(cph <= 0) return 0; const A = cph * aht / 3600; for(let N = Math.max(1, Math.ceil(A)); N < 60; N++){ if(1 - erlangC(N, A) * Math.exp(-(N - A) * T / aht) >= SL) return N; } return 60; }
// agents connectés en moyenne par créneau (jour × heure), reconstitués d'après les connexions / déconnexions ; un agent connecté à plusieurs files de la sélection compte une fois
function effConnected(qset, first, last, nWd){

function prioAnalysis(){
  const all = FULL.calls, inSeg = n => !SEG || SEGOF[n] === SEG;
  const end = all.length ? all[0][0] : new Date().toISOString(), start = all.length ? all[all.length - 1][0] : end;
  const histDays = Math.max(1, (Date.parse(end) - Date.parse(start)) / 864e5), perMonth = n => Math.round(n * 30 / histDays);
  const lim30 = new Date(Date.parse(end) - 30 * 864e5).toISOString(), last = all.length ? localParts(end)[0] : '';
  const A = [], R = []; // A : appels touchés ; R : autres risques
  const add = (list, o) => list.push(Object.assign({calls: 0, sev: 'fix'}, o));
  // 1) SDA qui perdent des appels (Contrôle des SDA)
  const C = ctlRun();
  C.causes.forEach(x => {
    if(x.sev === 'bad') add(A, {cat: 'Acheminement', title: x.title + (x.detail ? ' — ' + x.detail : ''), calls: perMonth(x.calls), unit: 'appels / mois sur ces SDA',
      detail: `${x.dids.size} SDA (${[...x.dids].slice(0, 4).map(phone).join(', ')}${x.dids.size > 4 ? '…' : ''}) · moments : ${[...x.moments].join(', ')}`, fix: 'Définir une destination (département, menu ou file) pour ces SDA dans la console.', link: 'controle', sev: 'crit'});
  });
  // 2) menus qui raccrochent quand le client ne choisit rien : appels réellement raccrochés dans le menu (30 j)
  const hang = {}; C.causes.filter(x => x.key[0] === 'I').forEach(x => { const dn = (x.detail || '').split(' ')[0]; if(dn) hang[dn] = x; });
  if(Object.keys(hang).length){ const n = {}; all.forEach(c => { if(c[0] < lim30 || c[1] !== 'in' || c[10] !== 'ivr_ab') return; const last2 = c[9][c[9].length - 1]; if(last2 && hang[last2[0]]) n[last2[0]] = (n[last2[0]] || 0) + 1; });
    Object.entries(hang).forEach(([dn, x]) => add(A, {cat: 'Menus', title: `Le menu ${dn} ${dnName(dn)} raccroche si le client ne choisit rien`, calls: n[dn] || 0, unit: 'appels raccrochés dans ce menu (30 j)',
      detail: `${x.dids.size} SDA concernés · moments : ${[...x.moments].join(', ')}`, fix: 'Faire répéter le message ou envoyer vers la messagerie quand le client ne choisit rien (délai du menu).', link: 'menus', sev: n[dn] ? 'fix' : 'obs'})); }
  // 3) files sans agent connecté
  const qc30 = {}; FULL.queueCalls.forEach(r => { if(r[0] >= lim30) (qc30[r[1]] ||= {n: 0, lost: 0}).n++; if(r[0] >= lim30 && !r[6]) qc30[r[1]].lost++; });
  FULL.queues.filter(q => inSeg(q.number) && q.members.length && !q.members.some(m => !m.status || m.status === 'LoggedIn')).forEach(q => add(A, {cat: 'Files', title: `File ${q.number} ${q.name} : aucun agent connecté`, calls: (qc30[q.number] || {n: 0}).n, unit: 'appels dans la file (30 j)',
    detail: `${q.members.length} membre(s), tous déconnectés · si personne ne répond : ${destTxt1(q.dest)}`, fix: 'Reconnecter au moins un agent dans la file, ou retirer la file du parcours.', link: 'indisp', sev: 'crit'}));
  // 4) appels manqués non rappelés (30 j)
  if(last){ const miss = missedAnalysis(addDaysISO(last, -29), last).filter(r => r.st === 'todo' && (!SEG || r.seg === SEG)), by = {};
    miss.forEach(r => { by[r.seg] = (by[r.seg] || 0) + 1; });
    Object.entries(by).forEach(([s, n]) => add(A, {cat: 'Rappels', title: `${segShort(s)} : clients qui ont appelé sans être rappelés`, calls: n, unit: 'clients non rappelés (30 j)',
      detail: 'Appels perdus sans rappel ni nouvel appel servi ensuite.', fix: 'Traiter la liste des appels manqués (onglet Appels manqués) et prévoir un rappel quotidien.', link: 'rappels', sev: n >= 50 ? 'crit' : 'fix'})); }
  // 5) créneaux sous-dotés : appels abandonnés en attente (8 semaines → par mois)
  FULL.queues.filter(q => inSeg(q.number)).forEach(q => { const E = effAnalysis(new Set([q.number]), 8), slots = E.G.flatMap((r, wd) => r.map((c, h) => ({c, wd, h}))).filter(x => x.c.st === 'bad' || x.c.st === 'warn');
    const ab = slots.reduce((a, x) => a + x.c.ab, 0); if(ab * 30 / 56 < 10) return;
    const worst = slots.sort((a, b) => b.c.ab - a.c.ab)[0];
    add(A, {cat: 'Effectif', title: `File ${q.number} ${q.name} : clients qui raccrochent aux heures chargées`, calls: Math.round(ab * 30 / 56), unit: 'appels abandonnés / mois',
      detail: `${slots.length} créneau(x) sous-doté(s), le pire : ${EFF_DAYS[worst.wd]} ${worst.h} h`, fix: 'Ajouter un agent ou une relève sur ces créneaux (onglet Effectif).', link: 'effectif', sev: ab > 60 ? 'crit' : 'fix'}); });
  // 6) jours fériés non configurés : appels attendus le prochain férié
  const today = new Date().toLocaleDateString('fr-CA', {timeZone: TZ}), y0 = +today.slice(0, 4), cfgF = ferCfg();
  const nextH = [...qcHolidays(y0), ...qcHolidays(y0 + 1)].find(h => h[1] >= today && !cfgF.skip.includes(h[0]));
  if(nextH){ const missSeg = {};
    FULL.groups.filter(g => !isSysGroup(g) && !/^___FAVORITES/.test(g.name) && g.routes?.office?.to && g.routes.office.to !== 'None' && g.hours?.type !== 'AllHours' && SEGOF[g.number] !== SEG_BRIDGE && inSeg(g.number))
      .forEach(g => { const sch = deptSchedule(g); if(!sch.isHol(nextH[1]) && sch.per(simWd(nextH[1])).length) (missSeg[SEGOF[g.number] || SEG_COMMON] ||= []).push(g.name); });
    const inc30 = {}; all.forEach(c => { if(c[1] === 'in' && c[0] >= lim30 && c[10] !== 'bridge') { const s = callSeg(c); inc30[s] = (inc30[s] || 0) + 1; } });
    Object.entries(missSeg).forEach(([s, ds]) => add(A, {cat: 'Jours fériés', title: `${segShort(s)} : ${nextH[0]} (${nextH[1]}) non configuré`, calls: Math.round((inc30[s] || 0) / 30), unit: `appels attendus ce jour-là`,
      detail: `${ds.length} département(s) : ${ds.slice(0, 4).join(', ')}${ds.length > 4 ? '…' : ''}`, fix: 'Saisir le jour férié dans ces départements (liste prête dans l\'onglet Jours fériés).', link: 'feries', sev: 'fix'})); }
  // 7) dépendance à une seule personne
  const ID = indispAnalysis();
  // (appels répondus, pas perdus : classé dans les autres risques)
  const dep = ID.risky.filter(x => x.why.some(w => /répond à/.test(w[1]))).sort((a, b) => b.served * b.share - a.served * a.share);
  if(dep.length) add(R, {cat: 'Personnes', title: `${dep.length} file(s) qui reposent sur une seule personne`, detail: dep.slice(0, 5).map(x => `${x.name} → ${x.top} ${dnName(x.top)} (${Math.round(100 * x.share)} %, ${nf(Math.round(x.served * x.share))} appels / 30 j)`).join(' ; ') + (dep.length > 5 ? '…' : ''),
    fix: 'Ajouter un ou une remplaçante dans ces files pour les absences (onglet Personnes indispensables).', link: 'indisp', sev: 'obs'});
  // autres risques (sécurité, matériel, configuration) sans impact direct sur les appels
  const S = secAnalysis(), elevNo = S.elevated.filter(r => (!SEG || r.seg === SEG) && r.rank >= 5 && !['on', 'ms'].includes(r.fa));
  if(elevNo.length) add(R, {cat: 'Sécurité', title: `${elevNo.length} compte(s) avec accès complet au système sans MFA`, detail: elevNo.map(r => r.e.number + ' ' + (r.e.first + ' ' + r.e.last).trim()).join(', '), fix: 'Relier ces comptes à Microsoft 365 avec la connexion Microsoft, ou activer la double authentification 3CX.', link: 'securite', sev: 'crit'});
  const named = FULL.extensions.filter(e => inSeg(e.number) && e.email && !['on', 'ms'].includes(mfaOf(e).k));
  if(named.length) add(R, {cat: 'Sécurité', title: `${named.length} poste(s) nominatif(s) sans MFA`, detail: named.slice(0, 6).map(e => e.number).join(', ') + (named.length > 6 ? '…' : ''), fix: 'Relier ces postes à Microsoft 365 ou activer la double authentification 3CX.', link: 'securite', sev: 'fix'});
  if(S.intl.length && !S.intlCalls) add(R, {cat: 'Sécurité', title: 'Appels internationaux autorisés mais jamais utilisés', detail: S.intl.map(o => o.name).join(', '), fix: 'Désactiver ou restreindre la règle sortante internationale (risque de fraude).', link: 'securite', sev: 'fix'});
  const fwd = S.fwd.filter(r => (!SEG || r.seg === SEG) && r.active);
  if(fwd.length) add(R, {cat: 'Sécurité', title: `${fwd.length} renvoi(s) externe(s) actif(s)`, detail: fwd.slice(0, 5).map(r => r.e.number + ' → ' + r.nums.map(phone).join(', ')).join(' ; '), fix: 'Vérifier que ces numéros sont connus et toujours nécessaires.', link: 'securite', sev: 'obs'});
  const ph = phoneRows(), old = ph.filter(r => r.st === 'old'), er = (FULL.fwErased || []).filter(f => f[2] >= lim30 && inSeg(f[4]));
  if(old.length) add(R, {cat: 'Téléphones', title: `${old.length} téléphone(s) à mettre à jour`, detail: [...new Set(old.map(r => r.model))].join(', '), fix: 'Lancer « Mettre à jour le firmware » dans la console (onglet Téléphones).', link: 'telephones', sev: 'fix'});
  if(er.length) add(R, {cat: 'Téléphones', title: `${er.length} firmware(s) effacé(s) depuis 30 jours`, detail: [...new Set(er.map(f => f[4]))].slice(0, 8).join(', '), fix: 'Relancer « Mettre à jour le firmware » sur ces téléphones après chaque modification.', link: 'telephones', sev: 'obs'});
  analyse().filter(f => f.sev === 'crit' || f.sev === 'fix').forEach(f => { if(/SDA|acheminement|férié|firmware|téléphone|MFA|authentification|aucun agent n'est connecté/i.test(f.title)) return;
    add(R, {cat: f.cat, title: f.title, detail: f.items.slice(0, 4).map(i => i.text).join(' ; ') + (f.items.length > 4 ? '…' : ''), fix: f.reco, link: 'reco', sev: f.sev}); });
  A.sort((a, b) => b.calls - a.calls); const SEVR = {crit: 0, fix: 1, obs: 2}; R.sort((a, b) => SEVR[a.sev] - SEVR[b.sev]);
  return {A, R, histDays};
}
V.priorites = el => {
  const P = prioAnalysis(), SEVL = {crit: ['Critique', 'bad'], fix: ['À corriger', 'warn'], obs: ['Observation', '']};
  const tot = P.A.filter(x => x.unit && /mois|30 j/.test(x.unit)).reduce((a, x) => a + x.calls, 0), mx = Math.max(1, ...P.A.map(x => x.calls));
  const row = (x, i, withCalls) => `<div class="card prio"><div class="prn">${i + 1}</div><div style="flex:1;min-width:0">
      <div><span class="pill ${SEVL[x.sev][1]}">${SEVL[x.sev][0]}</span> <span class="muted" style="font-size:12px">${esc(x.cat)}</span></div>
      <div style="font-weight:600;margin:3px 0">${esc(x.title)}</div><div class="muted" style="font-size:12.5px">${esc(x.detail || '')}</div>
      <div style="font-size:12.5px;margin-top:4px">➜ ${esc(x.fix || '')} <a class="dlink" href="#${esc(x.link)}">ouvrir ▸</a></div></div>
    ${withCalls ? `<div class="prc"><b>${nf(x.calls)}</b><div class="muted" style="font-size:11.5px">${esc(x.unit || '')}</div><div class="prbar"><i style="width:${100 * x.calls / mx}%"></i></div></div>` : ''}</div>`;
  el.innerHTML = `<div id="prwrap"><h2>Priorités</h2>
    <p class="lead">Tous les problèmes trouvés par l'interface${SEG ? ` pour le magasin <b>${esc(segName(SEG))}</b>` : ''}, réunis en une seule liste. D'abord ceux qui font <b>perdre des appels</b>, classés selon le nombre d'appels touchés (ramené à un mois quand l'historique le permet), puis les autres risques (sécurité, téléphones, configuration), classés par gravité.</p>
    <div class="grid kpis">${[['Problèmes qui touchent des appels', nf(P.A.length), P.A.length ? 'warn' : 'ok'], ['Appels touchés par mois (estimation)', nf(tot), tot ? 'bad' : 'ok'], ['Autres risques', nf(P.R.length), ''], ['Dont critiques', nf([...P.A, ...P.R].filter(x => x.sev === 'crit').length), 'bad']]
      .map(([l, v, c]) => `<div class="card kpi ph ${c}"><div class="v" style="font-size:21px">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
    <h3>Problèmes qui font perdre des appels (${P.A.length})</h3>
    ${P.A.length ? P.A.map((x, i) => row(x, i, true)).join('') : '<p><span class="pill ok">Aucun</span></p>'}
    <h3>Autres risques (${P.R.length})</h3>
    ${P.R.length ? P.R.map((x, i) => row(x, i, false)).join('') : '<p><span class="pill ok">Aucun</span></p>'}
    <p class="note">Les files qui reposent sur une seule personne sont dans « Autres risques » : leurs appels sont répondus, mais une absence les mettrait en danger. Les volumes viennent de l'historique du backup : appels reçus sur les SDA concernés (ramenés à 30 jours), appels raccrochés dans les menus, appels des files, clients non rappelés et abandons des 30 derniers jours ; pour un jour férié, la moyenne quotidienne des appels du magasin. Ce sont des ordres de grandeur pour décider quoi corriger en premier.</p></div>`;
};

// ---------- Matrice des droits : départements × rôles, droits propres et incohérences ----------
const MX_ROLES = ['users', 'receptionists', 'supervisors', 'managers', 'observers', 'group_admins', 'group_owners', 'system_admins', 'system_owners'];
const MX_SENS = ['canBargeIn', 'canSeeGroupRecordings', 'performOperations', 'allowToManageCompanyBook', 'allowToChangePresence', 'canSeeGroupCalls'];
function mxAnalysis(){
  const depts = FULL.groups.filter(g => g.roles && Object.keys(g.roles).length && g.name !== 'SYSTEM' && !/^___FAVORITES/.test(g.name));

  const ref = {};
  MX_ROLES.forEach(r => Object.keys(VR_FR).forEach(k => { const v = depts.map(g => g.roles[r]).filter(Boolean).map(x => !!x[k]);
    const t = v.filter(Boolean).length; (ref[r] ||= {})[k] = {val: t * 2 >= v.length, n: v.length, t}; }));
  const issues = [];
  const add = (sev, cat, title, detail, items, link) => issues.push({sev, cat, title, detail, items, link});
  // 1) définitions de rôle différentes de la majorité
  MX_ROLES.forEach(r => Object.keys(VR_FR).forEach(k => { const R = ref[r][k]; if(!R.n) return;
    const odd = depts.filter(g => inSeg(g) && g.roles[r] && !!g.roles[r][k] !== R.val);
    if(odd.length && odd.length < R.n / 2) add(R.val ? 'warn' : (MX_SENS.includes(k) ? 'bad' : 'warn'), 'Définition des rôles',
      `« ${VROLE_FR[r] || r} » ${R.val ? 'n\'a pas' : 'a'} le droit « ${VR_FR[k]} » dans ${odd.length} département${odd.length > 1 ? 's' : ''}`,
      `Contrairement aux ${R.n - odd.length} autres départements.`, odd.map(g => g.name), 'droits'); }));
  // 2) droits propres qui ajoutent des droits sensibles, et accès hors du magasin
  const own = [], outside = [];
  depts.forEach(g => g.members.forEach(m => {
    const e = EXT_BY[m.dn]; if(!e) return;
    const base = g.roles[m.role] || {}, eff = {...base, ...(m.rights || {})};
    if(m.rights){ const plus = Object.keys(m.rights).filter(k => m.rights[k] && !base[k]), minus = Object.keys(m.rights).filter(k => !m.rights[k] && base[k]);
      if(plus.length || minus.length) own.push({e, g, role: m.role, plus, minus, sens: plus.filter(k => MX_SENS.includes(k))}); }
    const se = SEGOF[e.number] || SEG_COMMON, sg = SEGOF[g.number] || SEG_COMMON;
    if(g.name !== '__DEFAULT__' && se !== sg && se !== SEG_COMMON && sg !== SEG_COMMON && sg !== SEG_BRIDGE && (eff.canSeeGroupRecordings || eff.canBargeIn || eff.canSeeGroupCalls))
      outside.push({e, g, role: m.role, what: ['canSeeGroupRecordings', 'canBargeIn', 'canSeeGroupCalls'].filter(k => eff[k])});
  }));
  const ownS = own.filter(x => !SEG || SEGOF[x.e.number] === SEG || SEGOF[x.g.number] === SEG), outS = outside.filter(x => !SEG || SEGOF[x.e.number] === SEG || SEGOF[x.g.number] === SEG);
  const sensBy = {}; ownS.filter(x => x.sens.length).forEach(x => (sensBy[x.e.number] ||= {e: x.e, l: []}).l.push(x));
  const sens = Object.values(sensBy);
  if(sens.length) add('bad', 'Droits propres', `${sens.length} poste${sens.length > 1 ? 's ont' : ' a'} des droits sensibles ajoutés à leur rôle`, 'Intervention dans les appels, écoute des enregistrements, prise des appels, gestion de l\'annuaire ou du statut des autres.',
    sens.map(x => `${x.e.number} ${(x.e.first + ' ' + x.e.last).trim()} : + ${[...new Set(x.l.flatMap(y => y.sens))].map(k => VR_FR[k]).join(', ')} — ${x.l.length} département${x.l.length > 1 ? 's' : ''} (${x.l.slice(0, 4).map(y => y.g.name).join(', ')}${x.l.length > 4 ? '…' : ''})`), 'visibilite');

// ---------- Plan de numérotation : numéros utilisés, plages par magasin, numéros libres ----------
let NP_CACHE = null;
function numPlan(){
  if(NP_CACHE) return NP_CACHE;
  const used = {}; // numéro -> {kind, dn}
  const put = (n, kind) => { if(/^\d{2,6}$/.test(String(n || ''))) used[n] ||= {kind, n: String(n)}; };
  FULL.extensions.forEach(e => put(e.number, 'Poste')); FULL.queues.forEach(q => put(q.number, "File d'attente")); FULL.ivrs.forEach(i => put(i.number, 'Menu (IVR)'));
  FULL.ringGroups.forEach(r => put(r.number, 'Groupe de sonnerie')); (FULL.parks || []).forEach(p => put(p, 'Parking')); FULL.lines.forEach(l => put(l.number, 'Trunk'));
  // plages : blocs de 100 numéros où un magasin détient la majorité des postes
  const blocks = {};
  Object.values(used).forEach(u => { const b = Math.floor(+u.n / 100) * 100, len = u.n.length; const k = len + ':' + b; const x = blocks[k] ||= {k, b, len, items: [], segs: {}};
    x.items.push(u); if(u.kind === 'Poste'){ const s = SEGOF[u.n] || SEG_COMMON; x.segs[s] = (x.segs[s] || 0) + 1; } });
  Object.values(blocks).forEach(x => { const e = Object.entries(x.segs).sort((a, b) => b[1] - a[1])[0], tot = Object.values(x.segs).reduce((a, b) => a + b, 0);
    x.owner = e && e[1] * 2 > tot ? e[0] : (tot ? null : (() => { const o = {}; x.items.forEach(u => { const s = SEGOF[u.n]; if(s) o[s] = (o[s] || 0) + 1; }); const t = Object.entries(o).sort((a, b) => b[1] - a[1])[0]; return t ? t[0] : null; })());
    x.free = []; const pad = n => String(n).padStart(x.len, '0'); for(let i = Math.max(x.b, x.len === 4 ? 1000 : x.b); i < x.b + 100; i++){ const s = pad(i); if(s.length === x.len && !used[s]) x.free.push(s); } });
  const bySeg = {};
  // plages de postes d'un magasin : blocs qui contiennent au moins un poste (les blocs de files et menus n'en font pas partie)
  Object.values(blocks).forEach(x => { if(x.owner && x.items.some(u => u.kind === 'Poste')) (bySeg[x.owner] ||= []).push(x); });
  Object.values(bySeg).forEach(a => a.sort((x, y) => y.items.filter(u => u.kind === 'Poste').length - x.items.filter(u => u.kind === 'Poste').length || x.b - y.b));
  return NP_CACHE = {used, blocks: Object.values(blocks).sort((a, b) => a.len - b.len || a.b - b.b), bySeg};
}
// numéros libres proposés pour un magasin : d'abord dans son bloc principal, à la suite des postes existants
function freeNumbers(seg, max = 30){
  const P = numPlan(), bl = P.bySeg[seg] || [];
  const out = [];
  bl.forEach(x => { const last = Math.max(...x.items.filter(u => u.kind === 'Poste').map(u => +u.n), x.b); const after = x.free.filter(n => +n > last), before = x.free.filter(n => +n <= last);
    [...after, ...before].forEach(n => out.length < max && out.push({n, block: x})); });
  return out;
}

function nvForwards(M, num){
  const dst = d => {
    if(!d || !d.to || d.to === 'None') return null;
    const n = d.dn === M.number ? num : d.dn, mine = d.dn === M.number;
    if(d.to === 'VoiceMail') return `messagerie vocale de <b>${esc(n || num)}</b>${!mine && d.dn ? ` <span class="muted">(${esc(dnName(d.dn))})</span>` : ''}`;
    if(d.to === 'External'){ const own = M.mobile && String(d.ext).replace(/\D/g, '').endsWith(M.mobile.replace(/\D/g, '').slice(-10));
      return own ? '<b>cellulaire du nouvel employé</b> (à saisir : celui du collègue ne doit pas être recopié)' : `numéro externe <b>${esc(phone(d.ext))}</b> <span class="muted">(à confirmer)</span>`; }
    if(d.dn) return `${esc(TO_FR[d.to] || d.to).toLowerCase()} <b>${esc(n)}</b>${mine ? '' : ` ${esc(dnName(d.dn))}`}`;
    return `<b>${esc((TO_FR[d.to] || d.to).toLowerCase())}</b>`; };
  const COND = {NoAnswer: 'sans réponse', Busy: 'occupé', NotRegistered: 'téléphone non connecté'}, HRS = {AllHours: 'heures d\'ouverture', OutOfOfficeHours: 'hors heures'};
  return M.profiles.slice().sort((a, b) => (FWD_ORDER.indexOf(a.name) + 1 || 99) - (FWD_ORDER.indexOf(b.name) + 1 || 99)).map(p => {
    const r = {}; p.routes.forEach(([k, d]) => { const t = k.split(' › '); r[t.slice(1).join('|')] = d; });
    const parts = [];
    if(Object.keys(r).some(k => /^(NoAnswer|Busy|NotRegistered)\|/.test(k))){
      Object.keys(COND).forEach(c => { const all = dst(r[c + '|AllCalls']), int = dst(r[c + '|Internal']);
        if(all || int) parts.push(`${COND[c]}${c === 'NoAnswer' && p.noAnswer ? ` (${esc(p.noAnswer)} s)` : ''} → ${all || '<span class="muted">aucun renvoi</span>'}${int ? ` ; appels internes → ${int}` : ''}`); });
    } else {
      [['External', 'appels externes'], ['Internal', 'appels internes']].forEach(([w, l]) => { const a = dst(r[w + '|AllHours']), o = dst(r[w + '|OutOfOfficeHours']);
        if(a || o) parts.push(a === o ? `${l} → ${a}` : `${l} : ${HRS.AllHours} → ${a || '<span class="muted">aucun renvoi</span>'}, ${HRS.OutOfOfficeHours} → ${o || '<span class="muted">aucun renvoi</span>'}`); });
    }
    if(p.ringMobile === 'True' || p.ringMobile === '1') parts.push('faire sonner aussi le cellulaire');
    const lab = FWD_ST[p.name] || p.name;
    return `<b>${esc(lab)}</b>${p.display && p.display !== p.name && p.display !== lab ? ` <span class="muted">« ${esc(p.display)} »</span>` : ''}${M.profile === p.name ? ' <span class="pill acc">statut actuel du collègue</span>' : ''} — ${parts.length ? parts.join(' · ') : '<span class="muted">aucun renvoi : les appels sonnent seulement sur le poste</span>'}`;
  });
}

        <span class="npbar"><i style="width:${x.items.length}%"></i></span></summary><div style="padding:0 12px 12px">${grid(x)}</div></details>`; }).join('')}
    <p class="note">Un bloc appartient au magasin qui y a la majorité des postes (sinon : partagé). Les numéros libres excluent tous les numéros déjà utilisés par un poste, une file, un menu, un groupe de sonnerie, un parking ou un trunk. Cliquez une case pour ouvrir l'élément.</p></div>`;

// ---------- Organigramme des magasins (onglet) ----------
V.organigramme = el => {

      g.members.slice().sort((a, b) => a.dn.localeCompare(b.dn, 'fr', {numeric: true})).map(m => leaf(`${dnLink(m.dn)} <span class="pill">${esc(VROLE_FR[m.role] || m.role)}</span>`, who(m.dn) + ' ' + g.name)), gs.length <= 3));

        q.members.map(m => leaf(`${dnLink(m.dn)} <span class="pill ${m.status === 'LoggedIn' ? 'ok' : ''}">${m.status === 'LoggedIn' ? 'Connecté' : 'Déconnecté'}</span>`, who(m.dn) + ' ' + q.name)), false); });
    const rgs = rs.map(r => node('org-r', `<span class="orgk">Groupe de sonnerie</span> ${dnLink(r.number)} <span class="muted">· ${esc(r.strategy)} · ${r.members.length} membre${r.members.length > 1 ? 's' : ''}</span>`,
      r.members.map(m => leaf(dnLink(m), who(m) + ' ' + r.name)), false));
    const menus = is.map(i => node('org-i', `<span class="orgk">Menu</span> ${dnLink(i.number)} <span class="muted">· ${i.options.length} touche${i.options.length > 1 ? 's' : ''}</span>`,
      i.options.slice().sort((a, b) => a.key.localeCompare(b.key)).map(o => leaf(`<span class="pill">Touche ${esc(o.key)}</span> ${o.dn ? dnLink(o.dn) : esc(TO_FR[o.type] || o.type)}`, who(o.dn || '') + ' ' + i.name)), false));
    const alone = posts.filter(e => !inDept.has(e.number)).sort((a, b) => a.number.localeCompare(b.number, 'fr', {numeric: true}));
    const sec = (t, arr) => arr.length ? `<li class="orgsec">${t} (${arr.length})</li>${arr.join('')}` : '';
    return `<li><details class="orgn org-s" open><summary><b>${esc(segName(s))}</b> <span class="muted">· ${posts.length} poste${posts.length > 1 ? 's' : ''} · ${gs.length} dép. · ${qs.length} file${qs.length > 1 ? 's' : ''} · ${rs.length} groupe${rs.length > 1 ? 's' : ''} · ${is.length} menu${is.length > 1 ? 's' : ''}</span></summary><ul>
      ${sec('Départements', deps)}${sec("Files d'attente", files)}${sec('Groupes de sonnerie', rgs)}${sec('Menus (IVR)', menus)}
      ${alone.length ? sec('Postes sans département dans ce magasin', [node('org-p', `<span class="muted">${alone.length} poste${alone.length > 1 ? 's' : ''}</span>`, alone.map(e => leaf(dnLink(e.number), who(e.number))), false)]) : ''}</ul></details></li>`;
  }).join('');
  el.innerHTML = `<div id="orgwrap"><h2>Organigramme des magasins</h2>
    <p class="lead">Vue en arbre de chaque magasin : départements et leurs membres (avec le rôle), files d'attente et leurs agents (état de connexion au moment du backup), groupes de sonnerie et menus vocaux${SEG ? ` — magasin <b>${esc(segName(SEG))}</b>` : ''}. Cliquez un nom pour l'ouvrir.</p>
    <p class="orgbar"><input id="orgq" type="search" placeholder="Rechercher un employé, un numéro, une file…" value="${esc(S.q)}"> <button class="btn" id="orgopen">Tout déplier</button> <button class="btn" id="orgclose">Tout replier</button> <button class="btn primary" id="orgprint">Imprimer / PDF</button> <span class="muted" id="orgmsg" style="font-size:12.5px"></span></p>
    <div class="card report" id="orgsheet"><h2 class="orgprt">Organigramme — ${esc(FULL.info.fqdn || '3CX')}${SEG ? ' — ' + esc(segName(SEG)) : ''}</h2><ul class="orgt">${tree || '<li class="muted">Aucun élément.</li>'}</ul></div></div>`;
  const all = () => [...el.querySelectorAll('#orgsheet details')];
  const filter = () => { const q = S.q.trim().toLowerCase(), sheet = $('#orgsheet');
    sheet.querySelectorAll('.orgl').forEach(l => l.hidden = !!q && !l.dataset.q.includes(q));
    let hits = 0;
    [...sheet.querySelectorAll('details')].reverse().forEach(d => { const n = d.querySelectorAll('.orgl:not([hidden])').length, self = d.querySelector('summary').innerText.toLowerCase().includes(q);
      d.parentElement.hidden = !!q && !n && !self; if(q && (n || self)) d.open = true; });
    sheet.querySelectorAll('.orgsec').forEach(h => { let x = h.nextElementSibling, vis = false; while(x && !x.classList.contains('orgsec')){ if(!x.hidden) vis = true; x = x.nextElementSibling; } h.hidden = !vis; });
    hits = sheet.querySelectorAll('.orgl:not([hidden])').length;
    $('#orgmsg').textContent = q ? `${hits} résultat${hits > 1 ? 's' : ''}` : ''; };
  $('#orgq').addEventListener('input', e => { S.q = e.target.value; filter(); });
  $('#orgopen').addEventListener('click', () => all().forEach(d => d.open = true));
  $('#orgclose').addEventListener('click', () => all().forEach(d => d.open = d.classList.contains('org-s')));
  $('#orgprint').addEventListener('click', () => { const p = document.createElement('div'); p.id = 'secprint'; p.innerHTML = $('#orgsheet').outerHTML.replace('id="orgsheet"', '');
    p.querySelectorAll('details').forEach(d => d.open = true); p.querySelectorAll('[hidden]').forEach(x => x.hidden = false);
    document.body.appendChild(p); document.body.classList.add('printing-sec'); window.print(); setTimeout(() => { p.remove(); document.body.classList.remove('printing-sec'); }, 800); });
  // un clic sur un nom dans l'en-tête d'une branche ouvre l'élément sans replier la branche
  $('#orgwrap').addEventListener('click', e => { if(e.target.closest('summary a.dn')) e.preventDefault(); }, true);
  if(S.q) filter();
};

// ---------- Références inverses : tout ce qui pointe vers un numéro ----------
// cat : 'route' (acheminement : menus, départements, files, groupes), 'sda' (numéros entrants), 'fwd' (renvois des collègues), 'member' (appartenances)
let REFS_CACHE = null;
function dnRefs(){
  if(REFS_CACHE) return REFS_CACHE;
  const R = {}, add = (n, r) => { if(n) (R[n] ||= []).push(r); };
  const via = d => d && d.dn && d.to !== 'External' ? d.dn : '';
  const vm = d => d && d.to === 'VoiceMail' ? ' (messagerie vocale)' : '';
  const GR = {office: "heures d'ouverture", outOfOffice: 'hors heures', break: 'pause', holidays: 'jours fériés'};
  FULL.ivrs.forEach(i => {
    i.options.forEach(o => add(o.dn, {cat: 'route', from: i.number, what: `Touche ${o.key} du menu`, how: (TO_FR[o.type] || o.type) + (o.type === 'VoiceMail' ? ' (messagerie vocale)' : '')}));
    if(i.timeoutDN) add(i.timeoutDN, {cat: 'route', from: i.number, what: 'Sans choix (délai) du menu', how: TO_FR[i.timeoutType] || i.timeoutType});
    if(i.invalidDN) add(i.invalidDN, {cat: 'route', from: i.number, what: 'Touche invalide du menu', how: ''});
    Object.entries(i.routes || {}).forEach(([k, d]) => add(via(d), {cat: 'route', from: i.number, what: `Acheminement ${GR[k] || k} du menu`, how: (TO_FR[d.to] || d.to) + vm(d)}));
  });
  FULL.groups.filter(g => !isSysGroup(g)).forEach(g => {
    Object.entries(g.routes).forEach(([k, d]) => add(via(d), {cat: 'route', from: g.number, what: `Acheminement ${GR[k] || k} du département`, how: (TO_FR[d?.to] || d?.to || '') + vm(d)}));
    if(via(g.operator)) add(via(g.operator), {cat: 'route', from: g.number, what: 'Opérateur du département', how: TO_FR[g.operator.to] || g.operator.to});
    g.members.forEach(m => add(m.dn, {cat: 'member', from: g.number, what: 'Membre du département', how: VROLE_FR[m.role] || m.role}));
  });
  FULL.queues.forEach(q => {
    if(via(q.dest)) add(via(q.dest), {cat: 'route', from: q.number, what: "Débordement (attente maximale) de la file", how: (TO_FR[q.dest.to] || q.dest.to) + vm(q.dest)});
    Object.entries(q.routes || {}).forEach(([k, d]) => add(via(d), {cat: 'route', from: q.number, what: `Acheminement ${GR[k] || k} de la file`, how: (TO_FR[d.to] || d.to) + vm(d)}));
    q.members.forEach(m => add(m.dn, {cat: 'member', from: q.number, what: 'Agent de la file', how: m.status === 'LoggedIn' ? 'connecté' : 'déconnecté'}));
    q.managers.forEach(m => add(m, {cat: 'member', from: q.number, what: 'Gestionnaire de la file', how: ''}));
  });
  FULL.ringGroups.forEach(r => {
    if(via(r.dest)) add(via(r.dest), {cat: 'route', from: r.number, what: 'Sans réponse du groupe de sonnerie', how: (TO_FR[r.dest.to] || r.dest.to) + vm(r.dest)});
    r.members.forEach(m => add(m, {cat: 'member', from: r.number, what: 'Membre du groupe de sonnerie', how: ''}));
  });
  // renvois : une ligne par collègue et par destination, avec la liste des statuts concernés (dans l'ordre de 3CX)
  FULL.extensions.forEach(e => { const per = {};
    e.profiles.forEach(p => p.routes.forEach(([k, d]) => { const n = via(d); if(!n || n === e.number) return;
      const x = per[n] ||= {st: [], how: (TO_FR[d.to] || d.to) + vm(d)}; const lab = (typeof FWD_ST !== 'undefined' && FWD_ST[p.name]) || p.name; if(!x.st.includes(lab)) x.st.push(lab); }));
    const ord = typeof FWD_ST !== 'undefined' ? Object.values(FWD_ST) : [];
    Object.entries(per).forEach(([n, x]) => { x.st.sort((a, b) => (ord.indexOf(a) + 1 || 99) - (ord.indexOf(b) + 1 || 99));
      add(n, {cat: 'fwd', from: e.number, what: x.st.length === ord.length && ord.length ? 'Renvoi (tous les statuts) de' : `Renvoi (${x.st.join(', ')}) de`, how: x.how}); }); });
  const HR = {office: "heures d'ouverture", outOfOffice: 'hors heures', holidays: 'jours fériés'};
  FULL.lines.forEach(l => { const by = {}; l.rules.forEach(r => by[r.data] = r); const def = l.rules.find(r => r.cond === 'ForwardAll');
    l.dids.forEach(did => { const r = by[did] || def; if(!r) return; const per = {};
      Object.keys(HR).forEach(k => { const n = via(r[k]); if(n) (per[n] ||= []).push(HR[k]); });
      Object.entries(per).forEach(([n, ks]) => add(n, {cat: 'sda', from: l.number, did, what: `SDA ${phone(did)}`, how: ks.join(', ') + (by[did] ? '' : ' — règle par défaut du trunk')})); }); });
  return REFS_CACHE = R;
}
const REF_CAT = {route: 'Acheminement (menus, départements, files, groupes)', sda: 'Numéros entrants (SDA)', fwd: 'Renvois de collègues', member: 'Appartenances'};
const refLine = r => `${r.what} ${r.cat === 'sda' ? `<span class="muted">(trunk ${esc(r.from)})</span>` : dnLink(r.from)}${r.how ? ` <span class="muted">→ ${esc(r.how)}</span>` : ''}`;

// ---------- Assistant « départ d'un employé » ----------
V.depart = el => {
  const S = window.__dp ||= {seg: SEG && SEG[0] !== '@' ? SEG : '', ext: '', rep: ''};
  const stores = SEG_LIST.filter(s => s[0] !== '@');
  if(!stores.includes(S.seg)) S.seg = stores[0] || '';
  const nm = e => (e.first + ' ' + e.last).trim();
  const byNum = (a, b) => a.number.localeCompare(b.number, undefined, {numeric: true});
  const exts = FULL.extensions.filter(e => SEGOF[e.number] === S.seg).sort(byNum);
  if(!exts.some(e => e.number === S.ext)) S.ext = (exts[0] || {}).number || '';
  const E = EXT_BY[S.ext];
  const reps = FULL.extensions.filter(e => e.number !== S.ext && SEGOF[e.number] === S.seg && e.email).sort(byNum);
  if(S.rep && !reps.some(e => e.number === S.rep)) S.rep = '';
  const RP = EXT_BY[S.rep];
  const to = RP ? `<b>${esc(RP.number)} ${esc(nm(RP))}</b>` : '<b>…</b> (remplaçant à choisir)';
  const refs = E ? (dnRefs()[E.number] || []) : [];
  const steps = [];
  if(E){
    const route = refs.filter(r => r.cat === 'route'), sda = refs.filter(r => r.cat === 'sda'), fwd = refs.filter(r => r.cat === 'fwd');
    steps.push(['Ce qui appelle ce poste', "Menus, départements, files, groupes de sonnerie → destination", route.length ? route.map(r => `${refLine(r)} — remplacer par ${to}`) : ["Aucun menu, département, file ni groupe n'envoie d'appels vers ce poste"]]);
    steps.push(['Numéros entrants (SDA)', 'Trunks (SIP Trunks) → trunk → règles entrantes (Inbound Rules)', sda.length ? sda.map(r => `${refLine(r)} — remplacer par ${to}`) : ['Aucun SDA ne mène directement à ce poste']]);
    steps.push(['Renvois des collègues', 'Utilisateurs → poste du collègue → Renvois (Forwarding Rules)', fwd.length ? fwd.map(r => `${refLine(r)} — remplacer par ${to}`) : ['Aucun collègue ne renvoie ses appels vers ce poste']]);
    steps.push(["Files d'attente", "Files d'attente (Call Queues) → file → Agents / Gestionnaires", E.queues.length || refs.some(r => r.what === 'Gestionnaire de la file') ? [
      ...E.queues.map(q => { const Q = FULL.queues.find(x => x.number === q); const others = Q ? Q.members.filter(m => m.dn !== E.number) : [];
        return `Retirer de ${dnLink(q)}${others.length ? ` <span class="muted">(${others.length} autre${others.length > 1 ? 's' : ''} agent${others.length > 1 ? 's' : ''}, ${others.filter(m => m.status === 'LoggedIn').length} connecté${others.filter(m => m.status === 'LoggedIn').length > 1 ? 's' : ''})</span>` : ' <span class="pill bad">seul agent de la file : ajouter le remplaçant d\'abord</span>'}${RP ? ` — ajouter ${to}` : ''}`; }),
      ...refs.filter(r => r.what === 'Gestionnaire de la file').map(r => `Retirer comme gestionnaire de ${dnLink(r.from)}${RP ? ` — nommer ${to}` : ''}`)] : ['Aucune file']]);
    steps.push(['Groupes de sonnerie', 'Groupes de sonnerie (Ring Groups) → groupe → Membres', E.ringGroups.length ? E.ringGroups.map(g => { const G = FULL.ringGroups.find(x => x.number === g); const n = G ? G.members.filter(m => m !== E.number).length : 0;
      return `Retirer de ${dnLink(g)}${n ? ` <span class="muted">(${n} autre${n > 1 ? 's' : ''} membre${n > 1 ? 's' : ''})</span>` : ' <span class="pill bad">seul membre du groupe</span>'}${RP ? ` — ajouter ${to}` : ''}`; }) : ['Aucun groupe']]);
    steps.push(['Départements et rôles', 'Utilisateurs → poste → Départements (Groups)', refs.filter(r => r.what === 'Membre du département').map(r => `${dnLink(r.from)} — rôle <b>${esc(r.how)}</b>${/Gestionnaire|Propriétaire|Administrateur|Superviseur|Réceptionniste/.test(r.how) ? ' <span class="pill acc">rôle à transmettre</span>' : ''}`).concat(['Les appartenances disparaissent avec la suppression du poste ; transmettre d\'abord les rôles de gestion au remplaçant']).slice(0, 99)]);
    const vms = (FULL.voicemails || []).filter(v => v.ext === E.number).length, gr = (FULL.vmGreetings || []).filter(v => v.ext === E.number).length, recs = (FULL.recordings || []).filter(r => r[1] === E.number).length;
    steps.push(['Messagerie vocale et enregistrements', 'Utilisateurs → poste → Messagerie vocale ; Enregistrements (Recordings)', [

      `Messages d'accueil personnels : <b>${nf(gr)}</b>`,
      `Enregistrements d'appels : <b>${nf(recs)}</b>${recs ? ' — vérifier la durée de conservation avant de supprimer le poste' : ''}`]]);
    const mfa = (() => { try{ return mfaOf(E); }catch(e){ return null; } })(), ext = E.profiles.some(p => p.routes.some(([, d]) => d.to === 'External'));
    steps.push(['Téléphone et compte', 'Téléphones (Phones) ; Utilisateurs → poste', [
      ...E.devices.map(d => `Téléphone <b>${esc(d.model || d.template)}</b> (MAC <span class="mono">${esc(d.mac)}</span>) — réinitialiser ou réattribuer${RP ? ` à ${to}` : ''}`),
      ...(E.devices.length ? [] : ['Aucun téléphone physique (application ou client Web seulement)']),
      ext ? '<b>Retirer les renvois vers un numéro externe</b> (cellulaire personnel) de tous les statuts' : 'Aucun renvoi externe à retirer',
      E.mobile ? 'Effacer le numéro de cellulaire du poste' : null,
      mfa && mfa.k === 'ms' ? `Compte relié à Microsoft 365 (${esc(mfa.upn || 'Entra ID')}) : la désactivation du compte Microsoft coupe l'accès 3CX ; prévenir le service informatique` : null,
      `Puis supprimer le poste ${esc(E.number)} : le numéro redevient libre dans le plan de numérotation`].filter(Boolean)]);
  }
  const total = refs.filter(r => r.cat !== 'member').length;
  el.innerHTML = `<div id="dpwrap"><h2>Départ d'un employé</h2>
    <p class="lead">Choisissez le poste qui part : l'assistant liste tout ce qui pointe vers lui (menus, départements, files, groupes, SDA, renvois de collègues) et tout ce qu'il faut retirer ou transmettre, avec un remplaçant facultatif. Une fiche à cocher et à imprimer, rien n'est modifié dans 3CX.</p>
    <div class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px">

      <label class="nvf">Employé qui part <select id="dpext">${exts.map(e => `<option value="${esc(e.number)}"${e.number === S.ext ? ' selected' : ''}>${esc(e.number + ' ' + nm(e))}</option>`).join('') || '<option value="">Aucun poste</option>'}</select></label>
      <label class="nvf">Remplaçant (facultatif) <select id="dprep"><option value="">— aucun pour l'instant —</option>${reps.map(e => `<option value="${esc(e.number)}"${e.number === S.rep ? ' selected' : ''}>${esc(e.number + ' ' + nm(e))}</option>`).join('')}</select></label></div>
    ${E ? `<div class="nvsheet report" id="dpsheet"><header class="rpcover"><div class="rpk">Fiche de départ · 3CXplore</div><h1>${esc(nm(E) || E.number)} — poste ${esc(E.number)}</h1>
