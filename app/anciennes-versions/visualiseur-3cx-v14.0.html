// textes composés (nombres, dates) : expressions régulières ; t() traduit la partie texte
const t = s => EN[s] !== undefined ? EN[s] : null;
const DAYS = {Lun: 'Mon', Mar: 'Tue', Mer: 'Wed', Jeu: 'Thu', Ven: 'Fri', Sam: 'Sat', Dim: 'Sun'};
const RX = [
  [/^(.+?) — (\d+) %$/, m => t(m[1]) && t(m[1]) + ' — ' + m[2] + ' %'],
  [/^Erreur : (.+)$/, m => 'Error: ' + (t(m[1]) || m[1])],
  [/^Version ([\d.]+) \(actuelle\)$/, m => 'Version ' + m[1] + ' (current)'],
  [/^([\d\s ]+) éléments?$/, m => m[1] + ' items'],
  [/^([\d\s ]+) acheminements?$/, m => m[1] + ' routing' + (m[1].trim() === '1' ? '' : 's')],
  [/^([\d\s ]+) critiques?$/, m => m[1] + ' critical'], [/^([\d\s ]+) observations?$/, m => m[1] + ' observation' + (m[1].trim() === '1' ? '' : 's')],
  [/^([\d\s ]+) à corriger$/, m => m[1] + ' to fix'], [/^([\d\s ]+) firmwares? effacés?$/, m => m[1] + ' firmware cleared'],
  [/^\+([\d\s ]+) autres?$/, m => '+' + m[1] + ' more'], [/^(\d+) derniers jours$/, m => 'Last ' + m[1] + ' days'],
  [/^\((\d+) derniers jours avec activité\)$/, m => '(last ' + m[1] + ' days with activity)'], [/^\(objectif (.+)\)$/, m => '(target ' + m[1] + ')'], [/^\(toutes les (\d+) s\)$/, m => '(every ' + m[1] + ' s)'],
  [/^(\d+)h – répondus : (.+)$/, m => m[1] + 'h – answered: ' + m[2]], [/^(\d+)h – non répondus : (.+)$/, m => m[1] + 'h – unanswered: ' + m[2]],
  [/^Surveillé par (\d+) téléphones?$/, m => 'Monitored by ' + m[1] + ' phone' + (m[1] === '1' ? '' : 's')], [/^Liste du (.+)$/, m => 'List of ' + m[1]],
  [/^Les plus faibles : (.+)$/, m => 'Weakest: ' + m[1]], [/^(Lun|Mar|Mer|Jeu|Ven|Sam|Dim) (\d.*)$/, m => DAYS[m[1]] + ' ' + m[2]],
  [/^Inactifs? > (\d+) (jours|j)$/, m => 'Inactive > ' + m[1] + (m[2] === 'j' ? ' d' : ' days')], [/^Inactif \((\d+) j\)$/, m => 'Inactive (' + m[1] + ' d)'], [/^(\d+) jours$/, m => m[1] + ' days'],
  [/^vu le (.+)$/, m => 'seen on ' + m[1]], [/^avec (.+)$/, m => 'with ' + m[1]],
  [/^Historique analysé : du (.+) au (.+)\.$/, m => 'History analysed: ' + m[1] + ' to ' + m[2] + '.'],
  [/^« Jamais utilisé » : aucun appel passé, reçu ou répondu sur toute la période de l'historique\. .*$/, m => "“Never used”: no call made, received or answered over the whole history. “Still in a routing”: the extension is unused or disabled, but a menu, queue, ring group, DID, forward or a colleague's BLF key still points to it (department membership alone does not count): calls may get lost there. “Phone never seen”: the phone's MAC address does not appear in any call quality report" + (/non vérifié/.test(m[0]) ? ' (not checked: no quality reports in this backup)' : '') + '; it may be unplugged or never installed. Check before deleting: an extension may be used rarely (substitute, meeting room, door phone) or have been created recently.'],
  [/^3CX (\S+) · sauvegarde du (.+?)(?: · chargé le (.+?))?(?: · (\d+) Mo)?$/, m => '3CX ' + m[1] + ' · backup of ' + m[2] + (m[3] ? ' · loaded on ' + m[3] : '') + (m[4] ? ' · ' + m[4] + ' MB' : '')],
  [/^· (Taux de réponse|Appels perdus|Attente moyenne en file|Taux de réponse en file \(agents\)) (.+)$/, m => '· ' + t(m[1]) + ' ' + m[2]],
  [/^Appel du (\S+) (\d+) h (\d+)$/, m => 'Call on ' + m[1] + ' ' + m[2] + ':' + m[3]],
  [/^Clients qui ont appelé sans obtenir de réponse .* jusqu'à la fin de l'historique du backup \((.+)\)\.$/, m => "Customers who called without getting an answer (abandoned in queue, hung up in menu, unanswered, external forward not answered, hung up while parked) and have not been called back since. A customer counts as “called back” if an outbound call was made to their number after their last missed call, or if they called back themselves and were served. Withheld numbers are ignored. The period applies to the date of the last missed call; the call-back is searched up to the end of the backup history (" + m[1] + ")."],
  [/^Téléphones de bureau rattachés à un poste jamais utilisé, inactif depuis plus de (\d+) jours ou désactivé : ils peuvent être récupérés ou donnés à un autre employé\.$/, m => 'Desk phones attached to an extension that was never used, inactive for more than ' + m[1] + ' days or disabled: they can be recovered or given to another employee.'],
  [/^Postes qui pourraient être supprimés ou réattribués .*Historique analysé : du (.+) au (.+)\.$/, m => "Extensions that could be deleted or reassigned (never used, inactive, duplicates, “vacant” or “test”, disabled), desk phones to recover, and peak concurrent calls. 3CX V20 is licensed by simultaneous calls (not per extension): deleting unneeded extensions simplifies management and frees any Microsoft 365 accounts, but the peak of simultaneous calls sets the licence size. History analysed: " + m[1] + ' to ' + m[2] + '.'],
  // libellé suivi d'un nombre entre parenthèses, d'une flèche ou de deux-points
  [/^(.+?) \(([\d\s ]+)\)$/, m => t(m[1]) && t(m[1]) + ' (' + m[2] + ')'], [/^(.+?) ([▸→])$/, m => t(m[1]) && t(m[1]) + ' ' + m[2]],
  [/^(.+?) :$/, m => t(m[1]) && t(m[1]) + ':'], [/^(.+?)…$/, m => t(m[1]) && t(m[1]) + '…'],
];
function tr(s){
  const k = s.replace(/\s+/g, ' ').trim(); if(!k || k.length > 1200 || !/[A-Za-zÀ-ÿ]/.test(k)) return null;

  if(!v || v === k) return null; // identique dans les deux langues : ne rien réécrire (sinon l'observateur reboucle)
  const out = s.replace(/\S[\s\S]*\S|\S/, () => v); return out === s ? null : out;
}
const SKIP = /^(SCRIPT|STYLE|TEXTAREA|CODE|PRE)$/, ATTRS = ['title', 'placeholder', 'aria-label'];
function trEl(e){ if(e.closest('[data-noi18n]')) return; for(const a of ATTRS){ const v = e.getAttribute(a); if(v){ const x = tr(v); if(x) e.setAttribute(a, x); } } }
function walk(root){
  if(root.nodeType === 3){ const p = root.parentElement; if(p && !SKIP.test(p.tagName) && !p.closest('[data-noi18n]')){ const x = tr(root.nodeValue); if(x) root.nodeValue = x; } return; }
  if(root.nodeType !== 1 || SKIP.test(root.tagName) || root.closest('[data-noi18n]')) return;
  trEl(root); root.querySelectorAll('[title],[placeholder],[aria-label]').forEach(trEl);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n = w.nextNode())){ const p = n.parentElement; if(!p || SKIP.test(p.tagName) || p.closest('[data-noi18n]')) continue; const x = tr(n.nodeValue); if(x) n.nodeValue = x; }
}
if(lang === 'en'){
  new MutationObserver(ms => { for(const m of ms){
    if(m.type === 'characterData') walk(m.target);
    else if(m.type === 'attributes') trEl(m.target);
    else m.addedNodes.forEach(walk); } }).observe(document.documentElement, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS});
  document.addEventListener('DOMContentLoaded', () => walk(document.body));
}
// bouton FR / EN du bandeau : change de langue et recharge la page (le backup ouvert est conservé)
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('#langbtn'); if(!b) return;
  try{ localStorage.setItem(KEY, lang === 'en' ? 'fr' : 'en'); }catch(er){} location.reload(); });
document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('langbtn'); if(!b) return;
  b.querySelector('.lb').textContent = lang === 'en' ? 'FR' : 'EN'; b.title = b.ariaLabel = lang === 'en' ? 'Afficher en français' : 'Show in English'; });
window.LANG = {lang, tr: s => tr(s) || s};
})();
</script>

  --k-dept:#a78bfa; --k-rg:#f472b6; --k-xt:#22d3ee;
}}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --panel2:#1e232a; --text:#e6e9ee; --muted:#95a0ae; --line:#2a3039;

*{box-sizing:border-box}

<div id="updbar" class="updbar" role="status" hidden></div>
<script>
// Mises à jour et installation : démarre au chargement de la page, même sans backup ouvert
(() => {
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// ---------- Vérification des mises à jour (dernière release publique de 3CXplore sur GitHub) ----------
// seule requête Internet de l'outil : elle demande à GitHub le numéro de la dernière version ; aucune donnée du backup n'est envoyée
const UPD_REPO = 'mat3108/3cxplore', APP_VERSION = '14.0';
const updCmp = (a, b) => { const x = String(a).replace(/^v/, '').split('.').map(Number), y = String(b).replace(/^v/, '').split('.').map(Number);
  for(let i = 0; i < Math.max(x.length, y.length); i++){ const d = (x[i] || 0) - (y[i] || 0); if(d) return d; } return 0; };
const updOn = () => { try{ return localStorage.getItem('maj3cx') !== 'off'; }catch(e){ return true; } };
async function updCheck(force){
  if(/^__/.test(APP_VERSION)) return {err: 'version de la page inconnue'};
  let c = null; try{ c = JSON.parse(localStorage.getItem('maj3cx-cache') || 'null'); }catch(e){}
  if(!force && c && c.tag && Date.now() - c.t < 864e5) return c; // au plus une vérification par jour
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 6000);
  try{
    const r = await fetch('https://api.github.com/repos/' + UPD_REPO + '/releases/latest', {signal: ac.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer', headers: {Accept: 'application/vnd.github+json'}});
    clearTimeout(tm); if(!r.ok) throw new Error('GitHub a répondu ' + r.status);
    const j = await r.json(); c = {t: Date.now(), tag: j.tag_name, url: j.html_url, name: j.name};
    try{ localStorage.setItem('maj3cx-cache', JSON.stringify(c)); }catch(e){}
    return c;
  }catch(e){ clearTimeout(tm); return {err: e.name === 'AbortError' ? 'pas de réponse (hors ligne ?)' : e.message}; }
}
function updBanner(c){
  window.__updLast = c; setTimeout(updDot, 0); const b = document.getElementById('updbar'); if(!b) return;
  let ign = ''; try{ ign = localStorage.getItem('maj3cx-ignore') || ''; }catch(e){}
  if(!c || c.err || !c.tag || updCmp(c.tag, APP_VERSION) <= 0 || ign === c.tag){ b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = `<span><b>${esc(c.name || '3CXplore ' + c.tag.replace(/^v/, ''))}</b> est disponible — vous utilisez la version ${esc(APP_VERSION)}.</span>${pwaWeb() ? `<a class="btn primary" href="${esc(window.APP_ROOT)}index.html">Ouvrir la nouvelle version</a>` : `<a class="btn primary" href="${esc(c.url)}" target="_blank" rel="noopener">Télécharger la mise à jour</a>`}<button class="btn" id="updx">Plus tard</button>`;
  document.getElementById('updx').addEventListener('click', () => { try{ localStorage.setItem('maj3cx-ignore', c.tag); }catch(e){} b.hidden = true; });
}
if(!window.__updDone){ window.__updDone = true; if(updOn()) updCheck(false).then(updBanner); }
else if(window.__updLast) updBanner(window.__updLast);
// bouton « Vérifier maintenant » de l'onglet Interface (branché une seule fois)
if(!window.__updWired){ window.__updWired = true;
  document.addEventListener('click', async e => { if(!e.target.closest || !e.target.closest('#uiupdnow')) return; const st = document.getElementById('uiupdst'); if(st) st.textContent = 'Vérification…';
    const c = await updCheck(true); updBanner(c);
    if(st) st.textContent = c.err ? `Impossible de vérifier : ${c.err}.` : updCmp(c.tag, APP_VERSION) > 0 ? `Mise à jour disponible : ${c.tag.replace(/^v/, '')} (vous utilisez ${APP_VERSION}).` : `Vous utilisez la dernière version (${APP_VERSION}).`; }); }

// ---------- Application installable (version web servie en https, par exemple GitHub Pages) ----------
// le service worker garde une copie de l'outil pour le hors ligne et récupère la dernière version quand le réseau est là ;
// les backups ne passent jamais par lui (ils sont lus depuis le disque, dans le navigateur)
const PWA_URL = 'https://mat3108.github.io/3cxplore/';
// page servie par un site sécurisé (https, ou localhost pour les essais) : pas depuis un fichier ouvert en double-clic
function pwaWeb(){ return !!window.isSecureContext && /^https?:$/.test(location.protocol) && !!window.APP_ROOT && !/^__/.test(window.APP_ROOT); }
if(!window.__pwaWired){ window.__pwaWired = true;
  window.__pwa = {prompt: null, installed: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true};
  if('serviceWorker' in navigator && pwaWeb()) navigator.serviceWorker.register(window.APP_ROOT + 'sw.js', {scope: window.APP_ROOT}).catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__pwa.prompt = e; const b = document.getElementById('pwainst'); if(b) b.hidden = false; });
  window.addEventListener('appinstalled', () => { window.__pwa.installed = true; window.__pwa.prompt = null; const s = document.getElementById('pwast'); if(s) s.textContent = '3CXplore est installé.'; });
  document.addEventListener('click', async e => { if(!e.target.closest || !e.target.closest('#pwainst')) return; const p = window.__pwa.prompt; if(!p) return;
    p.prompt(); try{ await p.userChoice; }catch(er){} window.__pwa.prompt = null; const b = document.getElementById('pwainst'); if(b) b.hidden = true; });
}

// ---------- Bouton « Mises à jour et installation » du bandeau du haut ----------
function updDot(){
  const b = document.getElementById('updbtn'); if(!b) return;
  const c = window.__updLast, newer = c && !c.err && c.tag && updCmp(c.tag, APP_VERSION) > 0, inst = !!(window.__pwa && window.__pwa.prompt);
  b.classList.toggle('has', !!(newer || inst)); b.querySelector('.dot').hidden = !(newer || inst);
  b.title = newer ? `Mise à jour disponible : ${c.tag.replace(/^v/, '')}` : inst ? 'Installer 3CXplore comme application' : 'Mises à jour et installation';
}
function updPopRender(msg){
  const p = document.getElementById('updpop'); if(!p) return;
  const c = window.__updLast, P = window.__pwa || {}, newer = c && !c.err && c.tag && updCmp(c.tag, APP_VERSION) > 0;
  const de = document.querySelector('.vmenu a[href*="documentation"]'), doc = de ? de.getAttribute('href') : '';
  const state = msg || (c && c.err ? `Dernière vérification impossible : ${c.err}.` : newer ? `${c.name || '3CXplore ' + c.tag.replace(/^v/, '')} est disponible.` : c && c.tag ? 'Vous utilisez la dernière version.' : 'Pas encore vérifié.');
  const dl = newer ? (pwaWeb() ? `<a class="btn primary" href="${esc(window.APP_ROOT)}index.html">Ouvrir la nouvelle version</a>` : `<a class="btn primary" href="${esc(c.url)}" target="_blank" rel="noopener">Télécharger la mise à jour</a>`) : '';
  const inst = P.installed ? '<div class="muted">Installé comme application : les mises à jour se font automatiquement.</div>'
    : pwaWeb() ? `<button class="btn" id="pwainst"${P.prompt ? '' : ' hidden'}>Installer l'application</button>${P.prompt ? '' : '<div class="muted">Installation : menu du navigateur (Chrome ou Edge) → « Installer 3CXplore ».</div>'}`
    : `<div class="muted">Pour installer 3CXplore comme application, ouvrez la version web : <a href="${PWA_URL}" target="_blank" rel="noopener">${PWA_URL.replace(/^https:\/\//, '')}</a></div>`;
  p.innerHTML = `<div class="updpv">3CXplore <b>${esc(APP_VERSION)}</b>${doc ? ` · <a href="${esc(doc)}">nouveautés</a>` : ''}</div>
    <div class="updps" id="updst">${esc(state)}</div>
    <div class="updpa"><button class="btn" id="updchk">Vérifier les mises à jour</button>${dl}</div>
    <div class="updpi"><div class="updpt">Application</div>${inst}</div>
    <div class="muted updpn">La vérification demande seulement à GitHub le numéro de la dernière version ; aucune donnée du backup n'est envoyée.${updOn() ? '' : ' Vérification au démarrage désactivée (onglet Interface).'}</div>`;
}
if(!window.__updHdr){ window.__updHdr = true;
  document.addEventListener('click', async e => {
    const btn = e.target.closest && e.target.closest('#updbtn'), pop = document.getElementById('updpop');

    if(sk!==null){ const c=cols[sk], k=c.sort||c.v; view = view.slice().sort((a,b)=>{const x=k(a),y=k(b); return (x>y?1:x<y?-1:0)*sd;}); }
    page=0; draw();
  }
  function draw(){
    const n = view.length, pages = Math.max(1, Math.ceil(n/pageSize));
    page = Math.min(page, pages-1);
    tb.innerHTML = view.slice(page*pageSize,(page+1)*pageSize).map((r,i)=>`<tr data-i="${page*pageSize+i}" class="${onRow?'click':''}">${cols.map(c=>`<td class="${c.num?'num':''} ${c.cls||''}">${c.f?c.f(r):esc(c.v(r))}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="muted">Aucun résultat</td></tr>`;
    el.querySelector('.count').textContent = nf(n)+' élément'+(n>1?'s':'');
    el.querySelector('.pg').textContent = `Page ${page+1} / ${pages}`;
    el.querySelector('[data-p="-1"]').disabled = page===0;
    el.querySelector('[data-p="1"]').disabled = page>=pages-1;
    el.querySelector('.pager').style.display = pages>1?'':'none';
    el.querySelectorAll('th').forEach((th,i)=>th.className=(cols[i].num?'num ':'')+(i===sk?(sd>0?'s-asc':'s-desc'):''));
    keep();
  }
  el.querySelector('input').addEventListener('input', e => { q=e.target.value; apply(); });
  el.querySelectorAll('select[data-f]').forEach(s=>s.addEventListener('change',e=>{fvals[s.dataset.f]=e.target.value; apply();}));
  el.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{const i=+th.dataset.i; if(sk===i) sd=-sd; else {sk=i; sd=cols[i].num?-1:1;} apply();}));
  el.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{page+=+b.dataset.p; draw();}));
  tb.addEventListener('click', e => { if(e.target.closest('a,audio,input,select,button,label')) return; const tr=e.target.closest('tr[data-i]'); if(tr && onRow) onRow(view[+tr.dataset.i]); });
  // restaurer l'état mémorisé (valeurs des champs, puis page)
  el.querySelector('input').value = q;
  el.querySelectorAll('select[data-f]').forEach(s => { if(fvals[s.dataset.f]) s.value = fvals[s.dataset.f]; });
  const startPage = page; apply();
  if(startPage){ page = startPage; draw(); }
}

function flowNode(n, depth, seen){
  const d = DN[n];
  if(!d) return `<div class="leaf">${n?`<span class="mono">${esc(n)}</span>`:'<span class="muted">–</span>'}</div>`;
  const head = `<span class="pill acc">${esc(d.kind)}</span> ${dnLink(n)}`;
  if(seen.has(n) || depth>7) return `<div class="leaf">${head} <span class="muted">(déjà affiché)</span></div>`;
  const s2 = new Set(seen); s2.add(n);
  const o = d.obj; let kids = [];
  const sub = (label, dd) => {
    if(!dd || !dd.to || dd.to==='None' || dd.to==='ProceedWithNoExceptions') return;
    if(dd.dn && DN[dd.dn] && dd.to!=='VoiceMail') kids.push([label, flowNode(dd.dn, depth+1, s2)]);
    else kids.push([label, `<div class="leaf">${destHTML(dd)}</div>`]);
  };
  if(d.kind==='Département'){
    sub('Heures d\'ouverture', o.routes.office); sub('Hors heures', o.routes.outOfOffice);
    sub('Pause', o.routes.break); sub('Fériés', o.routes.holidays);
  } else if(d.kind==='Standard (IVR)'){
    o.options.slice().sort((a,b)=>a.key.localeCompare(b.key)).forEach(op => sub('Touche '+op.key, {to:op.type, dn:op.dn, ext:op.data}));
    if(o.timeoutType) sub(`Sans choix (${o.timeout}s)`, o.timeoutDN ? {to:o.timeoutType, dn:o.timeoutDN} : {to:o.timeoutType});
  } else if(d.kind==="File d'attente"){
    kids.push(['Agents', `<div class="leaf">${o.members.length? o.members.map(m=>`<span class="pill">${esc(m.dn)} ${esc(dnName(m.dn))}</span>`).join(''):'<span class="muted">aucun</span>'}</div>`]);
    sub(`Délai max (${o.masterTimeout}s)`, o.dest);
  } else if(d.kind==='Groupe de sonnerie'){
    kids.push(['Membres', `<div class="leaf">${o.members.map(m=>`<span class="pill">${esc(m)} ${esc(dnName(m))}</span>`).join('')}</div>`]);
    sub(`Sans réponse (${o.ringTime}s)`, o.dest);
  }
  if(!kids.length) return `<div class="leaf">${head}</div>`;
  return `<details ${depth<2?'open':''}><summary>${head}</summary>${kids.map(([l,h])=>h.startsWith('<details')?h.replace('<summary>',`<summary><span class="lbl">${esc(l)} →</span> `):h.replace('<div class="leaf">',`<div class="leaf"><span class="lbl">${esc(l)} →</span> `)).join('')}</details>`;
}

function stackChart(keys, vals){
  if(!keys.length) return '<p class="muted">Aucune donnée</p>';
  const W=1000,H=220,P=30, max=Math.max(...vals.map(v=>v.in+v.out+v.int),1), bw=(W-P)/keys.length;
  let s=`<svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="Volume quotidien">`;
  [0,.5,1].forEach(f=>{const y=H-(H-10)*f; s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text class="ax" x="${P-4}" y="${y+3}" text-anchor="end">${Math.round(max*f)}</text>`;});
  keys.forEach((k,i)=>{ let y=H; const v=vals[i];
    [['int','var(--c-int)'],['out','var(--c-out)'],['in','var(--c-in)']].forEach(([t,c])=>{const h=(H-10)*v[t]/max; if(h>0){y-=h; s+=`<rect x="${P+i*bw+1}" y="${y}" width="${Math.max(bw-2,1)}" height="${h}" fill="${c}"><title>${k} – ${{in:'Entrants',out:'Sortants',int:'Internes'}[t]} : ${v[t]}</title></rect>`;}});
    if(i%Math.ceil(keys.length/12)===0) s+=`<text class="ax" x="${P+i*bw+bw/2}" y="${H+16}" text-anchor="middle">${k.slice(5)}</text>`;
  });
  return s+'</svg>';
}
function hourChart(hrs){
  const W=600,H=180,P=28, max=Math.max(...hrs.map(h=>h.a+h.m),1), bw=(W-P)/24;
  let s=`<svg viewBox="0 0 ${W} ${H+22}" role="img" aria-label="Appels par heure">`;
  [0,.5,1].forEach(f=>{const y=H-(H-10)*f; s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text class="ax" x="${P-4}" y="${y+3}" text-anchor="end">${Math.round(max*f)}</text>`;});
  hrs.forEach((h,i)=>{ const ha=(H-10)*h.a/max, hm=(H-10)*h.m/max;
    s+=`<rect x="${P+i*bw+2}" y="${H-ha}" width="${bw-4}" height="${ha}" fill="var(--c-in)"><title>${i}h – répondus : ${h.a}</title></rect><rect x="${P+i*bw+2}" y="${H-ha-hm}" width="${bw-4}" height="${hm}" fill="var(--bad)" opacity=".8"><title>${i}h – non répondus : ${h.m}</title></rect>`;
    if(i%2===0) s+=`<text class="ax" x="${P+i*bw+bw/2}" y="${H+14}" text-anchor="middle">${i}h</text>`; });
  return s+'</svg>';
}

// ---------- Diagramme de flux d'appel (par SDA) ----------
const DAY_ABBR = {Monday:'Lun',Tuesday:'Mar',Wednesday:'Mer',Thursday:'Jeu',Friday:'Ven',Saturday:'Sam',Sunday:'Dim'};
const DAY_ORDER = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function hoursSummary(h){
  if(!h) return [];
  if(!h.days.length) return [h.type==='AllHours' ? 'Ouvert 24 h/24' : ''].filter(Boolean);
  const per = DAY_ORDER.map(d => { const x = h.days.find(y => y.day===d); return x && x.p.length ? x.p.map(p => p.join('–')).join(', ') : 'fermé'; });
  const out = []; let i = 0;
  while(i < 7){ let j = i; while(j+1 < 7 && per[j+1]===per[i]) j++;
    out.push((i===j ? DAY_ABBR[DAY_ORDER[i]] : DAY_ABBR[DAY_ORDER[i]]+'–'+DAY_ABBR[DAY_ORDER[j]]) + ' ' + per[i]); i = j+1; }
  return out;
}
const KIND_STYLE = {
  did:{c:'var(--accent)', t:'SDA'}, rule:{c:'var(--muted)', t:'Règle entrante'}, 'Département':{c:'var(--k-dept)', t:'Département'},
  'Standard (IVR)':{c:'var(--warn)', t:'Standard (IVR)'}, "File d'attente":{c:'var(--c-out)', t:"File d'attente"},
  'Groupe de sonnerie':{c:'var(--k-rg)', t:'Groupe de sonnerie'}, 'Poste':{c:'var(--c-int)', t:'Poste'},
  ext:{c:'var(--k-xt)', t:'Numéro externe'}, vm:{c:'var(--warn)', t:'Messagerie vocale'}, end:{c:'var(--bad)', t:'Fin'}, other:{c:'var(--c-int)', t:'Autre'},
};

function buildFlow(entry){
  const nodes = new Map(), edges = [];
  let uid = 0;
  const addNode = n => { nodes.set(n.id, n); return n.id; };
  const addEdge = (from, to, label, extra) => {
    const e = edges.find(x => x.from===from && x.to===to);
    if(e){ if(label && !e.labels.includes(label)) e.labels.push(label); return; }
    edges.push({from, to, labels: label ? [label] : [], ...(extra||{})});
  };
  const skip = d => !d || !d.to || d.to==='None' || d.to==='ProceedWithNoExceptions';
  function target(d){
    if(d.to==='VoiceMail') return addNode({id:'vm:'+(d.dn||uid++), kind:'vm', title:'Messagerie vocale', sub: d.dn ? d.dn+' '+dnName(d.dn) : '', lines:[], dn:d.dn});
    if(d.to==='External'){ const v = viaRule(d.ext);
      return addNode({id:'ext:'+d.ext, kind:'ext', title: phone(d.ext), sub: v ? 'via '+(v.routes[0]?.gw||v.name) : 'Numéro externe', lines:[]}); }
    if(d.dn && DN[d.dn]) return dnNode(d.dn);
    if(d.to==='EndCall') return addNode({id:'end:'+(uid++), kind:'end', title:'Raccrocher', sub:'', lines:[]});
    return addNode({id:'o:'+(uid++), kind:'other', title: TO_FR[d.to]||d.to, sub: d.dn||'', lines:[]});
  }
  function dnNode(n){
    const id = 'dn:'+n;
    if(nodes.has(id)) return id;
    const d = DN[n], o = d.obj;
    const node = {id, kind:d.kind, title:d.name||n, sub:n, lines:[], dn:n};
    addNode(node);
    if(d.kind==='Département'){
      node.lines = hoursSummary(o.hours);
      [['office','Ouvert'],['outOfOffice','Fermé'],['break','Pause'],['holidays','Fériés']].forEach(([k,l]) => {
        const r = o.routes[k]; if(!skip(r)) addEdge(id, target(r), l);
      });
    } else if(d.kind==='Standard (IVR)'){
      if(o.prompt) node.lines.push('♪ '+o.prompt);
      o.options.slice().sort((a,b)=>a.key.localeCompare(b.key)).forEach(op => {
        const dd = {to:op.type, dn:op.dn, ext:op.data}; if(!skip(dd)) addEdge(id, target(dd), 'Touche '+op.key);
      });
      if(o.timeoutType==='RepeatPrompt') node.lines.push(`Sans choix (${o.timeout}s) : répète le message`);
      else if(o.timeoutType) { const dd = o.timeoutDN ? {to:o.timeoutType, dn:o.timeoutDN} : {to:o.timeoutType}; if(!skip(dd)) addEdge(id, target(dd), `Sans choix (${o.timeout}s)`); }
      if(o.invalidDN && DN[o.invalidDN]) addEdge(id, dnNode(o.invalidDN), 'Touche invalide');
    } else if(d.kind==="File d'attente"){
      node.lines.push(`${o.strategy} · ${o.ringTimeout}s/agent`);
      if(o.intro && o.introEnabled) node.lines.push('♪ '+o.intro);
      node.agents = o.members.map(m => m.dn+' '+dnName(m.dn)+(m.status && m.status!=='LoggedIn' ? ' (déconnecté)' : ''));
      if(!skip(o.dest)) addEdge(id, target(o.dest), `Délai max (${o.masterTimeout}s)`);
    } else if(d.kind==='Groupe de sonnerie'){
      node.lines.push(`${o.strategy} · ${o.ringTime}s`);
      node.agents = o.members.map(m => m+' '+dnName(m));
      if(!skip(o.dest)) addEdge(id, target(o.dest), `Sans réponse (${o.ringTime}s)`);
    } else if(d.kind==='Poste'){
      if(o.email) node.lines.push(o.email);
    }
    return id;
  }
  // racine : SDA puis règle entrante
  const did = addNode({id:'did', kind:'did', title: phone(entry.did), sub: entry.line.gateway, lines: lineCalls[entry.did] ? [nf(lineCalls[entry.did])+' appels reçus dans le backup'] : []});
  const ru = entry.rule;
  if(!ru){ addEdge(did, addNode({id:'norule', kind:'end', title:'Aucune règle entrante', sub:'', lines:[]}), ''); return {nodes, edges}; }
  const rid = addNode({id:'rule', kind:'rule', title: ru.name || (entry.isDefault ? 'Règle par défaut du trunk' : 'Règle du SDA'),
    sub: entry.isDefault ? 'ForwardAll' : (ru.cond==='BasedOnDID' ? 'Selon le SDA' : ru.cond), lines: entry.isDefault ? ['Aucune règle propre à ce SDA'] : []});
  addEdge(did, rid, '');
  const periods = [['office', ru.altOOO||ru.altHol ? 'Ouvert' : 'Toujours']];
  if(ru.altOOO) periods.push(['outOfOffice','Fermé']);
  if(ru.altHol) periods.push(['holidays','Fériés']);
  periods.forEach(([k,l]) => { const dd = ru[k]; if(skip(dd)) addEdge(rid, addNode({id:'none', kind:'end', title:'Aucune destination', sub:'', lines:["L'appel n'est pas acheminé"]}), l); else addEdge(rid, target(dd), l); });
  return {nodes, edges};
}

const NW = 250, GX = 200, GY = 26, LINE = 15, PORT = 19;
function nodeHeight(n, ports){
  const ag = n.agents ? Math.min(n.agents.length, 14) + (n.agents.length > 14 ? 1 : 0) + 1 : 0;
  return Math.max(46 + (n.lines.length + ag) * LINE + (n.lines.length || ag ? 6 : 0), ports * PORT + 14);
}
function layoutFlow(g){
  const ids = [...g.nodes.keys()], out = {}, inc = {};
  ids.forEach(i => { out[i] = []; inc[i] = []; });
  // arêtes de retour (cycles) par DFS
  const state = {}, order = [];
  const dfs = v => { state[v] = 1; order.push(v);
    for(const e of g.edges.filter(e => e.from===v)){ if(state[e.to]===1) e.back = true; else if(!state[e.to]) dfs(e.to); }
    state[v] = 2; };
  dfs('did'); ids.forEach(i => { if(!state[i]) dfs(i); });
  g.edges.forEach(e => { if(!e.back){ out[e.from].push(e.to); inc[e.to].push(e.from); } });
  // couches : plus long chemin depuis la racine
  const layer = {}; const indeg = {}; ids.forEach(i => indeg[i] = inc[i].length);
  const q = ids.filter(i => !indeg[i]); ids.forEach(i => layer[i] = 0);
  while(q.length){ const v = q.shift(); for(const w of out[v]){ layer[w] = Math.max(layer[w], layer[v]+1); if(--indeg[w]===0) q.push(w); } }
  const L = []; order.forEach(i => (L[layer[i]] ||= []).push(i));
  const H = {}; ids.forEach(i => H[i] = nodeHeight(g.nodes.get(i), Math.max(out[i].length, inc[i].length)));
  // points de passage pour les flèches qui sautent des colonnes (elles ne traversent plus les boîtes)
  let vk = 0;
  g.edges.forEach(e => {
    e.via = [];
    if(e.back || layer[e.to] - layer[e.from] < 2) return;
    let prev = e.from;
    for(let l = layer[e.from]+1; l < layer[e.to]; l++){
      const v = '~'+(vk++); layer[v] = l; H[v] = PORT; inc[v] = [prev]; L[l].push(v); e.via.push(v); prev = v;
    }
    inc[e.to] = inc[e.to].map(x => x===e.from ? prev : x);
  });
  const allIds = ids.concat(g.edges.flatMap(e => e.via));
  const pos = {};
  L.forEach((col, li) => {
    // ordre : barycentre des parents
    if(li > 0) col.sort((a,b) => {
      const bc = v => { const p = inc[v].filter(x => pos[x]); return p.length ? p.reduce((s,x) => s + pos[x].y + H[x]/2, 0)/p.length : 1e9; };
      return bc(a) - bc(b);
    });
    let y = 0;
    col.forEach(v => {
      const p = inc[v].filter(x => pos[x]);
      const want = li > 0 && p.length ? p.reduce((s,x) => s + pos[x].y + H[x]/2, 0)/p.length - H[v]/2 : y;
      const yy = Math.max(want, y);
      pos[v] = {x: li*(NW+GX), y: yy}; y = yy + H[v] + GY;
    });
  });
  // recentrer les couches trop hautes vers le haut si possible (aucun y négatif)
  const minY = Math.min(...allIds.map(i => pos[i].y));
  allIds.forEach(i => pos[i].y -= minY - 20);
  const W = Math.max(...ids.map(i => pos[i].x + NW)) + 40;
  const Hh = Math.max(...allIds.map(i => pos[i].y + H[i])) + 70;
  // points d'attache : sorties réparties sur le bord droit (triées selon la cible), entrées sur le bord gauche
  const cy = i => pos[i].y + H[i]/2;
  const spread = (i, n, k) => n === 1 ? cy(i) : cy(i) + (k - (n-1)/2) * Math.min(PORT, (H[i]-14)/(n-1));
  ids.forEach(i => {
    const first = e => e.via.length ? e.via[0] : e.to;
    const o = g.edges.filter(e => e.from===i && !e.back).sort((a,b) => cy(first(a))-cy(first(b)));
    o.forEach((e,k) => e.sy = spread(i, o.length, k));
  });
  const last = e => e.via.length ? cy(e.via[e.via.length-1]) : e.sy;
  ids.forEach(i => { const n = g.edges.filter(e => e.to===i && !e.back).sort((a,b) => last(a)-last(b)); n.forEach((e,k) => e.ty = spread(i, n.length, k)); });
  return {pos, H, W, Hh};
}
function trunc(s, n){ s = String(s ?? ''); return s.length > n ? s.slice(0, n-1)+'…' : s; }
function renderFlow(g){
  const {pos, H, W, Hh} = layoutFlow(g);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" class="flowsvg" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-arrow"/></marker></defs>`;
  // arêtes
  g.edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to]; if(!a || !b) return;
    const label = e.labels.join(' · ');
    let d, lx, ly;
    if(!e.back && b.x > a.x){
      const x1 = a.x+NW, y1 = e.sy, x2 = b.x, y2 = e.ty;
      // trajet : départ → (traversée de chaque colonne intermédiaire au point réservé) → arrivée
      const pts = [[x1, y1]];
      e.via.forEach(v => { const yv = pos[v].y + PORT/2; pts.push([pos[v].x, yv], [pos[v].x+NW, yv]); });
      pts.push([x2-2, y2]);
      d = `M${x1},${y1} L${x1+12},${y1}`;
      for(let k = 0; k+1 < pts.length; k += 2){
        const [ax, ay] = k===0 ? [x1+12, y1] : pts[k], [bx, by] = pts[k+1];
        if(k > 0) d += ` L${ax},${ay}`;
        const c1 = ax + Math.min(140, (bx-ax)*0.6), c2 = bx - Math.min(80, (bx-ax)*0.4);
        d += ` C${c1},${ay} ${c2},${by} ${bx},${by}`;
      }
      s += `<path d="${d}" class="f-edge" marker-end="url(#arr)"/><circle cx="${x1}" cy="${y1}" r="2.5" class="f-arrow"/>`;
      if(label) s += `<text x="${x1+8}" y="${y1-4}" class="f-elabel">${esc(trunc(label, 30))}</text>`;
    } else {
      // retour vers un élément déjà affiché : courbe par le bas
      const x1 = a.x+NW/2, y1 = a.y+H[e.from], x2 = b.x+NW/2+20, y2 = b.y+H[e.to];
      const yb = Math.max(y1, y2) + 40;
      d = `M${x1},${y1} C${x1},${yb} ${x2},${yb} ${x2},${y2+2}`;
      s += `<path d="${d}" class="f-edge back" marker-end="url(#arr)"/>`;
      if(label) s += `<text x="${(x1+x2)/2}" y="${yb-8}" text-anchor="middle" class="f-elabel">${esc(trunc(label, 34))} ↺</text>`;
    }
  });
  // nœuds
  g.nodes.forEach(n => {
    const p = pos[n.id], h = H[n.id], st = KIND_STYLE[n.kind] || KIND_STYLE.other;
    s += `<g class="f-node${n.dn?' click':''}" ${n.dn?`data-dn="${esc(n.dn)}"`:''} transform="translate(${p.x},${p.y})">
      <title>${esc(st.t+' — '+n.title+(n.sub?' ('+n.sub+')':''))}</title>
      <rect width="${NW}" height="${h}" rx="9" class="f-box" style="stroke:${st.c}"/>
      <rect width="5" height="${h}" rx="2" style="fill:${st.c}"/>
      <text x="14" y="17" class="f-kind" style="fill:${st.c}">${esc(st.t.toUpperCase())}${n.sub?' · '+esc(trunc(n.sub, 22)):''}</text>
      <text x="14" y="36" class="f-title">${esc(trunc(n.title, 30))}</text>`;
    let y = 36 + 6;
    n.lines.forEach(l => { y += LINE; s += `<text x="14" y="${y}" class="f-line">${esc(trunc(l, 38))}</text>`; });
    if(n.agents){
      y += LINE; s += `<text x="14" y="${y}" class="f-line strong">${n.agents.length} agent${n.agents.length>1?'s':''}</text>`;
      n.agents.slice(0, 14).forEach(a => { y += LINE; s += `<text x="22" y="${y}" class="f-line">• ${esc(trunc(a, 34))}</text>`; });
      if(n.agents.length > 14){ y += LINE; s += `<text x="22" y="${y}" class="f-line muted">+ ${n.agents.length-14} autres</text>`; }
    }
    s += `</g>`;
  });
  return {svg: s + '</svg>', W, Hh};
}

V.enreg = el => {

  const banner = inB === undefined
    ? `<p class="segbar">Ce backup a été chargé avec une version antérieure de l'interface : impossible de savoir s'il contient les fichiers audio. Rechargez le .zip (« Choisir un backup ») pour vérifier.</p>`

    ? `<p class="segbar warnbar"><b>Enregistrements non inclus dans le backup utilisé.</b> Le backup ne contient que la liste des enregistrements, pas les fichiers audio : l'option « Inclure les enregistrements » est désactivée dans les sauvegardes de la console 3CX (Sauvegarde → options). Si vous l'activez, prévoyez un backup beaucoup plus volumineux.</p>`
    : linked
    ? `<p class="segbar okbar"><b>${nf(inB)} enregistrement${inB > 1 ? 's' : ''} disponible${inB > 1 ? 's' : ''} dans le backup</b> : cliquez sur « Écouter » pour lire un enregistrement, ou téléchargez-le.</p>`
    : `<div class="segbar"><b>Ce backup contient ${nf(inB)} enregistrement${inB > 1 ? 's' : ''}.</b> Pour les écouter, sélectionnez à nouveau le même fichier .zip (il n'est pas recopié dans le navigateur à cause de sa taille ; à refaire après chaque rechargement de la page).
        <label class="btn primary" style="margin-left:8px">Sélectionner le zip du backup<input type="file" id="reclink" accept=".zip,application/zip" hidden></label> <span id="reclst" class="bkst"></span></div>`;
  const avail = r => inB > 0 && linked && BK.recHas(r[5]);
  el.innerHTML = `<div id="enwrap"><h2>Enregistrements</h2><p class="lead">Enregistrements d'appels référencés dans le backup (${nf(D.recordings.length)}).</p>${banner}<div id="t"></div></div>`;
  table($('#t'), {
    rows: D.recordings, pageSize: 100, state: (window.__recTable ||= {}),
    search: r => [r[1], dnName(r[1]), r[2], r[3], phone(r[3]), r[5]].join(' '),
    filters: [{label: 'Tous les postes', options: [...new Set(D.recordings.map(r => r[1]))].sort().map(n => [n, n + ' ' + dnName(n)]), test: (r, v) => r[1] === v},
              ...(inB > 0 && linked ? [{label: 'Écoute : tous', options: [['1', 'Écoute disponible'], ['0', 'Non inclus dans le backup']], test: (r, v) => avail(r) === (v === '1')}] : [])],
    cols: [{h: 'Date', v: r => r[0], f: r => fmtD(r[0])}, {h: 'Poste', v: r => r[1], f: r => dnLink(r[1])}, {h: 'Correspondant', v: r => r[3], f: r => `<span class="mono">${esc(phone(r[3]))}</span>`},
      {h: 'Durée', num: 1, v: r => r[4], f: r => dur(r[4])},
      {h: 'Écoute', v: r => avail(r) ? 1 : 0, f: r => avail(r) ? `<span class="recplay"><button class="btn recbtn" data-u="${esc(r[5])}">▶ Écouter</button></span>`
        : `<span class="muted" style="font-size:12px">${inB === undefined ? 'inconnu (recharger le zip)' : inB > 0 && !linked ? 'sélectionner le zip' : 'Non inclus dans le backup utilisé'}</span>`},
      {h: 'Fichier', v: r => r[5], cls: 'mono muted'}],
  });
  const W = $('#enwrap');
  W.addEventListener('click', async e => {
    const b = e.target.closest('.recbtn'); if(!b) return;
    const u = b.dataset.u, cell = b.closest('.recplay'); b.disabled = true; b.textContent = 'Chargement…';
    try{
      const blob = await BK.recBlob(u); if(!blob) throw new Error('fichier introuvable');
      const url = URL.createObjectURL(blob), fn = u.split('/').pop(); (window.__recUrls ||= []).push(url);
      cell.innerHTML = `<audio controls autoplay src="${url}" style="height:30px;max-width:240px;vertical-align:middle"></audio> <a class="dlink" href="${url}" download="${esc(fn)}" title="Télécharger">⬇</a>`;
    }catch(er){ cell.innerHTML = `<span class="pill bad">Lecture impossible : ${esc(er.message)}</span>`; }
  });
  const lk = $('#reclink');
  if(lk) lk.addEventListener('change', async e => { const f = e.target.files[0]; if(!f) return; const st = $('#reclst'); st.className = 'bkst'; st.textContent = 'Lecture du zip…';
    try{ const n = await BK.linkRecZip(f); st.textContent = `${nf(n)} enregistrements reliés.`; V.enreg(el); }
    catch(er){ st.className = 'bkst err'; st.textContent = 'Erreur : ' + er.message; } });
};

// ---------- Navigation ----------
// ---------- Recommandations : analyse automatique du backup ----------
const SEV = {crit:{l:'Critique', c:'bad'}, fix:{l:'À corriger', c:'warn'}, obs:{l:'Observation', c:'acc'}};
const NOTE_ST = {todo:'À traiter', doing:'En cours', done:'Corrigé', ignore:'Ignoré'};
const ROUTING_TO = new Set(['Extension','Queue','IVR','RoutePoint','RingGroup']);
const isSystemGroup = g => /^(__|SYSTEM$|FGRP)/.test(g.number + '') || /^(__DEFAULT__|SYSTEM)$/.test(g.name) || /^__FAVORITES/.test(g.name);
const itemDN = n => ({html: dnLink(n), text: n + ' ' + dnName(n)});
const itemDID = d => ({html: `<a class="dlink" href="#diagramme/${esc(d)}" title="Voir le diagramme du flux"><span class="mono">${esc(phone(d))}</span></a>`, text: phone(d)});
const itemTxt = t => ({html: esc(t), text: t});

function analyse(){
  const F = [];
  const add = (id, sev, cat, title, detail, reco, items) => F.push({id, sev, cat, title, detail, reco, items: items || []});

  // --- Références (toutes les destinations configurées) ---
  const refs = []; // {from, label, dest}
  allDIDs.forEach(r => { if(!r.rule) return;
    [['office','ouvert'],['outOfOffice','fermé'],['holidays','fériés']].forEach(([k,l]) => { if(k==='office' || (k==='outOfOffice'&&r.rule.altOOO) || (k==='holidays'&&r.rule.altHol)) refs.push({from:'SDA '+phone(r.did), did:r.did, label:l, dest:r.rule[k]}); }); });
  D.groups.forEach(g => Object.entries(g.routes).forEach(([k,d]) => refs.push({from:g.number, label:k, dest:d})));
  D.ivrs.forEach(i => { i.options.forEach(o => refs.push({from:i.number, label:'touche '+o.key, dest:{to:o.type, dn:o.dn}}));
    if(i.timeoutDN) refs.push({from:i.number, label:'sans choix', dest:{to:i.timeoutType, dn:i.timeoutDN}}); });
  D.queues.forEach(q => refs.push({from:q.number, label:'délai max', dest:q.dest}));
  D.ringGroups.forEach(r => refs.push({from:r.number, label:'sans réponse', dest:r.dest}));

  // 1. SDA non acheminés
  const unrouted = allDIDs.filter(r => !r.rule || !r.rule.office || ['None','ProceedWithNoExceptions'].includes(r.rule.office.to));
  if(unrouted.length) add('unrouted', 'crit', 'Acheminement', `${unrouted.length} SDA sans destination`,
    'Ces numéros n\'ont pas de règle entrante propre, ou leur règle (souvent la règle par défaut « ForwardAll » du trunk) ne mène nulle part : les appels reçus sur ces numéros ne sont pas acheminés.',
    'Créer une règle entrante pour chaque SDA utilisé, ou donner une destination à la règle par défaut du trunk. Retirer du trunk les SDA qui ne sont plus utilisés.',
    unrouted.map(r => itemDID(r.did)));

  // 2. Destinations vers des éléments inexistants
  const broken = refs.filter(x => x.dest && ROUTING_TO.has(x.dest.to) && x.dest.dn && !DN[x.dest.dn]);
  if(broken.length) add('broken', 'crit', 'Acheminement', `${broken.length} destination${broken.length>1?'s':''} vers un élément inexistant`,
    'Ces renvois pointent vers un numéro interne qui n\'existe plus dans la configuration (élément supprimé ou renuméroté).',
    'Corriger chaque destination vers un élément existant.',
    broken.map(x => ({html: `${x.did ? itemDID(x.did).html : dnLink(x.from)} <span class="muted">(${esc(x.label)})</span> → <span class="mono">${esc(x.dest.dn)}</span>`, text: `${x.from} (${x.label}) -> ${x.dest.dn}`})));

  // 3. Files sans agent / sans agent connecté
  const qOff = D.queues.filter(q => q.members.length && q.members.every(m => m.status && m.status !== 'LoggedIn'));
  if(qOff.length) add('q-off', 'fix', "Files d'attente", `${qOff.length} file${qOff.length>1?'s':''} dont aucun agent n'est connecté`,
    'Au moment du backup, tous les agents de ces files étaient déconnectés de la file.',
    'Vérifier que c\'est voulu (file de nuit, file désactivée) ; sinon connecter les agents.',
    qOff.map(q => itemDN(q.number)));

  // 4. Files : abandons et « aucun agent »
  const qAb = D.queues.map(q => ({q, s: D.queueStats[q.number]})).filter(x => x.s && x.s.total >= 20 && x.s.abandoned / x.s.total > 0.2)
    .sort((a,b) => b.s.abandoned/b.s.total - a.s.abandoned/a.s.total);
  if(qAb.length) add('q-abandon', 'fix', "Files d'attente", `${qAb.length} file${qAb.length>1?'s':''} avec plus de 20 % d'appels non servis`,
    'Calculé sur les appels en file présents dans le backup (au moins 20 appels).',
    'Revoir le nombre d\'agents aux heures de pointe, les délais de sonnerie et la destination de débordement.',
    qAb.map(x => ({html: `${dnLink(x.q.number)} <span class="muted">— ${pct(x.s.abandoned, x.s.total)} non servis sur ${nf(x.s.total)}</span>`, text: `${x.q.number} ${x.q.name} : ${Math.round(100*x.s.abandoned/x.s.total)} % sur ${x.s.total}`})));
  const qNA = D.queues.map(q => ({q, s: D.queueStats[q.number]})).filter(x => x.s && x.s.noAgents > 0).sort((a,b) => b.s.noAgents - a.s.noAgents);
  if(qNA.length) add('q-noagents', 'fix', "Files d'attente", `${qNA.length} file${qNA.length>1?'s':''} ont reçu des appels sans aucun agent disponible`,
    '3CX a enregistré des appels arrivés dans la file alors qu\'aucun agent n\'était connecté (« NoAgents »).',
    'Prévoir une destination immédiate quand aucun agent n\'est connecté, ou ajuster les horaires du département.',
    qNA.map(x => ({html: `${dnLink(x.q.number)} <span class="muted">— ${nf(x.s.noAgents)} appel${x.s.noAgents>1?'s':''}</span>`, text: `${x.q.number} ${x.q.name} : ${x.s.noAgents}`})));
  const q1 = D.queues.filter(q => q.members.length === 1);
  if(q1.length) add('q-single', 'obs', "Files d'attente", `${q1.length} file${q1.length>1?'s':''} avec un seul agent`,
    'Si cet agent est absent ou occupé, personne d\'autre ne reçoit l\'appel.',
    'Ajouter un agent de relève ou un débordement court.',
    q1.map(q => ({html: `${dnLink(q.number)} <span class="muted">— ${esc(q.members[0].dn+' '+dnName(q.members[0].dn))}</span>`, text: `${q.number} ${q.name}`})));
  const qNoDest = D.queues.filter(q => q.members.length && (!q.dest || q.dest.to === 'None') && +q.masterTimeout >= 600);
  if(qNoDest.length) add('q-nodest', 'obs', "Files d'attente", `${qNoDest.length} file${qNoDest.length>1?'s':''} sans débordement et avec une attente maximale de 10 min ou plus`,
    'L\'appelant peut attendre longtemps sans autre option.',
    'Envisager un débordement (messagerie, autre file, rappel) après un délai raisonnable.',
    qNoDest.map(q => ({html: `${dnLink(q.number)} <span class="muted">— ${Math.round(q.masterTimeout/60)} min</span>`, text: `${q.number} ${q.name}`})));

  // 5. Renvois vers une messagerie désactivée
  const curProfile = e => e.profiles.find(p => p.name === e.profile) || null;
  const vmOff = D.extensions.filter(e => !e.vm && curProfile(e)?.routes.some(([, d]) => d.to === 'VoiceMail'));
  if(vmOff.length) add('vm-off', 'fix', 'Postes', `${vmOff.length} poste${vmOff.length>1?'s':''} renvoient vers la messagerie alors qu'elle est désactivée`,
    'Dans le profil actuellement actif de ces postes, un renvoi mène à la messagerie vocale, mais la messagerie est désactivée : l\'appelant ne peut pas laisser de message.',
    'Activer la messagerie de ces postes, ou changer la destination de renvoi du profil actif.',
    vmOff.map(e => ({html: `${dnLink(e.number)} <span class="muted">— profil ${esc(e.profile)}</span>`, text: `${e.number} ${dnName(e.number)} (${e.profile})`})));

  // 6. MAC en double
  const macs = {}; D.extensions.forEach(e => e.devices.forEach(d => { if(d.mac) (macs[d.mac.toUpperCase()] ||= []).push(e.number); }));
  const dupMac = Object.entries(macs).filter(([, l]) => l.length > 1);
  if(dupMac.length) add('mac-dup', 'fix', 'Téléphones', `${dupMac.length} adresse${dupMac.length>1?'s':''} MAC utilisée${dupMac.length>1?'s':''} par plusieurs postes`,
    'Le même téléphone est provisionné sur plusieurs postes : seul le dernier provisionnement est réellement appliqué.',
    'Garder le téléphone sur un seul poste.',
    dupMac.map(([m, l]) => ({html: `<span class="mono">${esc(m)}</span> → ${l.map(n => dnLink(n)).join(', ')}`, text: `${m} -> ${l.join(', ')}`})));

  // 7. Urgences
  if(!D.outbound.some(o => (o.prefix||'').split(',').some(p => p.trim() === '911')))
    add('no-911', 'crit', 'Sortant', 'Aucune règle sortante pour le 911', 'Aucune règle sortante ne correspond au préfixe 911.', 'Créer une règle prioritaire pour le 911 vers un trunk qui achemine les appels d\'urgence.', []);

  // 8. Courriel
  if(!D.info.mailHost) add('no-mail', 'fix', 'Système', 'Serveur courriel non configuré', 'Sans serveur courriel, 3CX ne peut pas envoyer les messages vocaux, alertes et rapports.', 'Configurer le serveur SMTP dans les paramètres courriel.', []);

  // --- Accessibilité depuis les SDA ---
  const reach = new Set(); const stack = [];
  const push = n => { if(n && DN[n] && !reach.has(n)){ reach.add(n); stack.push(n); } };
  allDIDs.forEach(r => { if(r.rule) ['office','outOfOffice','holidays'].forEach(k => push(r.rule[k]?.dn)); });
  while(stack.length){ const n = stack.pop(), d = DN[n], o = d.obj;
    if(d.kind==='Département') Object.values(o.routes).forEach(x => push(x?.dn));
    else if(d.kind==='Standard (IVR)'){ o.options.forEach(x => push(x.dn)); push(o.timeoutDN); push(o.invalidDN); }
    else if(d.kind==="File d'attente"){ o.members.forEach(m => push(m.dn)); push(o.dest?.dn); }
    else if(d.kind==='Groupe de sonnerie'){ o.members.forEach(push); push(o.dest?.dn); } }
  const qNo = D.queues.filter(q => !q.members.length), qNoR = qNo.filter(q => reach.has(q.number)), qNoU = qNo.filter(q => !reach.has(q.number));
  if(qNoR.length) add('q-empty', 'crit', "Files d'attente", `${qNoR.length} file${qNoR.length>1?'s':''} d'attente sans aucun agent, atteinte${qNoR.length>1?'s':''} par des appels entrants`,
    'Un parcours d\'appel entrant mène à ces files, mais personne ne peut y répondre : l\'appel attend jusqu\'au délai maximal puis suit le débordement (ou est perdu).',
    'Ajouter des agents, ou modifier les renvois qui mènent à ces files.', qNoR.map(q => itemDN(q.number)));
  if(qNoU.length) add('q-empty-unused', 'obs', "Files d'attente", `${qNoU.length} file${qNoU.length>1?'s':''} d'attente sans agent et non utilisée${qNoU.length>1?'s':''} par les SDA`,
    'Ces files n\'ont aucun agent et aucun parcours d\'appel entrant n\'y mène.', 'Les supprimer si elles ne servent plus.', qNoU.map(q => itemDN(q.number)));
  const orph = [...D.queues.map(q => q.number), ...D.ivrs.map(i => i.number), ...D.ringGroups.map(r => r.number)].filter(n => !reach.has(n));
  if(orph.length) add('orphans', 'obs', 'Acheminement', `${orph.length} file${orph.length>1?'s':''}, standard${orph.length>1?'s':''} ou groupe${orph.length>1?'s':''} jamais atteint${orph.length>1?'s':''} depuis un SDA`,
    'Aucun parcours d\'appel entrant ne mène à ces éléments. Ils peuvent encore servir en composition interne ou en transfert.',
    'Vérifier s\'ils sont encore utiles ; sinon les supprimer pour simplifier la configuration.',
    orph.map(itemDN));

  // 9. Postes sans activité
  const active = new Set();
  D.calls.forEach(c => { active.add(c[2]); active.add(c[4]); active.add(c[6]); c[9].forEach(p => active.add(p[0])); });
  const idle = D.extensions.filter(e => !active.has(e.number));
  if(idle.length) add('idle-ext', 'obs', 'Postes', `${idle.length} poste${idle.length>1?'s':''} sans aucun appel dans l'historique du backup`,
    'Ni appel passé, ni appel reçu ou répondu sur toute la période couverte par l\'historique.',
    'Vérifier si ces postes (et leurs licences) sont encore nécessaires.',
    idle.map(e => itemDN(e.number)));
  const vacant = D.extensions.filter(e => /vacant|libre|test|temp/i.test(e.first + ' ' + e.last));
  if(vacant.length) add('vacant', 'obs', 'Postes', `${vacant.length} poste${vacant.length>1?'s':''} nommé${vacant.length>1?'s':''} « vacant », « test » ou similaire`,
    'Ces postes semblent temporaires ou non attribués.', 'Les réattribuer ou les supprimer.', vacant.map(e => itemDN(e.number)));
  const noCid = D.extensions.filter(e => !e.callerId);
  if(noCid.length) add('no-cid', 'obs', 'Postes', `${noCid.length} poste${noCid.length>1?'s':''} sans numéro d'appelant sortant (Caller ID)`,
    'Ces postes utilisent le numéro d\'appelant par défaut du trunk lors des appels sortants.', 'Définir un Caller ID si un numéro précis doit s\'afficher.', noCid.map(e => itemDN(e.number)));
  const remote = D.extensions.filter(e => !e.lanOnly);
  if(remote.length) add('remote', 'obs', 'Sécurité', `${remote.length} poste${remote.length>1?'s':''} autorisé${remote.length>1?'s':''} à s'enregistrer hors du réseau local`,
    'L\'option « réseau local seulement » n\'est pas activée : ces postes peuvent s\'enregistrer depuis Internet (télétravail, application mobile).',
    'Normal pour les utilisateurs mobiles ; sinon activer la restriction au réseau local.', remote.map(e => itemDN(e.number)));

  // 10. Firmwares
  const fw = {}; D.extensions.forEach(e => e.devices.forEach(d => { if(d.model && d.firmware) ((fw[d.model] ||= {})[d.firmware] ||= []).push(e.number); }));
  const fwMix = Object.entries(fw).filter(([, v]) => Object.keys(v).length > 1);
  if(fwMix.length) add('fw', 'obs', 'Téléphones', `${fwMix.length} modèle${fwMix.length>1?'s':''} de téléphone avec plusieurs versions de firmware`,
    'Des téléphones du même modèle n\'ont pas tous la même version de firmware.', 'Uniformiser le firmware depuis la console 3CX (mise à jour des téléphones).',
    fwMix.map(([m, v]) => ({html: `<b>${esc(m)}</b> : ${Object.entries(v).map(([f, l]) => `<span class="pill">${esc(f)} × ${l.length}</span>`).join('')}`, text: `${m} : ${Object.entries(v).map(([f, l]) => f+' x'+l.length).join(', ')}`})));

  // 11. Départements
  const depts = D.groups.filter(g => !isSystemGroup(g) && g.members.length);
  const noHol = depts.filter(g => !g.holidays.length);
  if(noHol.length && !FULL.groups.some(g => Array.isArray(g.holidayDates))) add('no-holidays', 'obs', 'Horaires', `${noHol.length} département${noHol.length>1?'s':''} sans jour férié configuré`,
    'Les jours fériés ne sont pas définis : les jours fériés, ces départements suivent leur horaire normal.', 'Ajouter les jours fériés de l\'année (Québec / Canada).', noHol.map(g => itemDN(g.number)));
  const noRoute = depts.filter(g => (!g.routes.office || g.routes.office.to === 'None') && allDIDs.some(r => r.rule?.office?.dn === g.number));
  if(noRoute.length) add('dept-noroute', 'fix', 'Acheminement', `${noRoute.length} département${noRoute.length>1?'s':''} recevant des SDA sans acheminement défini`,
    'Des SDA arrivent sur ces départements, mais aucune destination n\'est définie pour les heures d\'ouverture.', 'Définir la destination des heures d\'ouverture et hors heures.', noRoute.map(g => itemDN(g.number)));

  // 12. Fichiers audio manquants
  const have = new Set(D.prompts.map(p => p.file));
  const used = [];
  D.ivrs.forEach(i => i.prompt && used.push([i.prompt, i.number]));
  D.queues.forEach(q => { if(q.intro && q.introEnabled) used.push([q.intro, q.number]); if(q.moh) used.push([q.moh, q.number]); });
  D.groups.forEach(g => Object.values(g.prompts).forEach(p => p && used.push([p, g.number])));
  const miss = used.filter(([f]) => !have.has(f) && !/^onhold|^default/i.test(f));
  if(miss.length && D.prompts.length) add('audio-miss', 'obs', 'Audio', `${miss.length} fichier${miss.length>1?'s':''} audio référencé${miss.length>1?'s':''} mais absent${miss.length>1?'s':''} du backup`,
    'Ces messages sont configurés, mais le fichier n\'est pas dans le dossier des invites du backup (il peut se trouver dans un jeu d\'invites système).', 'Vérifier que le message joue bien ; sinon le téléverser à nouveau.',
    miss.map(([f, n]) => ({html: `${esc(f)} <span class="muted">—</span> ${dnLink(n)}`, text: `${f} (${n})`})));

  // 13. Activité des appels entrants
  const inc = D.calls.filter(c => c[1]==='in'), st = {}; inc.forEach(c => st[c[10]] = (st[c[10]]||0)+1);
  if(inc.length){
    const lost = (st.q_ab||0) + (st.ivr_ab||0) + (st.miss||0) + (st.fwd_no||0) + (st.park_ab||0);
    add('lost', lost/inc.length > 0.1 ? 'fix' : 'obs', 'Appels', `${pct(lost, inc.length)} des appels entrants n'aboutissent pas`,
      `Sur ${nf(inc.length)} appels entrants : ${nf(st.q_ab||0)} abandons en file, ${nf(st.ivr_ab||0)} raccrochés au menu, ${nf(st.fwd_no||0)} renvois externes sans réponse, ${nf(st.park_ab||0)} raccrochés en parking, ${nf(st.miss||0)} non répondus.`,
      'Analyser les heures de pointe (tableau de bord) et les files concernées (onglet Appels en file).', []);
    const top = {}; inc.filter(c => c[10]==='fwd_no').forEach(c => { const k = c[9].length ? c[9][c[9].length-1][0] : c[4]; top[k] = (top[k]||0)+1; });
  }

  // 14. Sécurité : connexions administrateur
  const logins = D.audit.filter(a => a[1]==='Connexion');
  const pubIps = [...new Set(logins.map(a => a[5]).filter(ip => ip && !/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.)/.test(ip)))];
  if(pubIps.length) add('admin-ip', 'obs', 'Sécurité', `Connexions à la console depuis ${pubIps.length} adresse${pubIps.length>1?'s':''} IP publique${pubIps.length>1?'s':''}`,
    'Adresses Internet depuis lesquelles quelqu\'un s\'est connecté à la console d\'administration (journal d\'audit).', 'Vérifier que ces adresses sont connues ; restreindre l\'accès à la console par IP si possible.',
    pubIps.map(ip => { const l = logins.filter(a => a[5]===ip); return {html: `<span class="mono">${esc(ip)}</span> <span class="muted">— ${l.length} connexion${l.length>1?'s':''}, ${esc([...new Set(l.map(a => a[3]))].join(', '))}</span>`, text: `${ip} (${l.length})`}; }));
  const rec = D.extensions.filter(e => e.record).length;
  add('recording', 'obs', 'Système', `Enregistrement des appels activé sur ${rec} poste${rec>1?'s':''} sur ${D.extensions.length}`,
    `${nf(D.recordings.length)} enregistrements sont référencés dans le backup ; les fichiers audio eux-mêmes n'y sont pas.`, 'Vérifier l\'espace disque et la durée de conservation des enregistrements sur le serveur.', []);

  const ph = phoneRows(), phOld = ph.filter(r => r.st === 'old'), phUnk = ph.filter(r => r.st === 'unk'), phMods = modelRows(ph);
  const srvBad = phMods.filter(m => m.st === 'missing' || m.st === 'srvold');
  if(srvBad.length) add('fw-server', 'fix', 'Téléphones', `${srvBad.length} modèle${srvBad.length>1?'s':''} de téléphone sans le firmware recommandé par 3CX sur le serveur`,
    `Le firmware recommandé par 3CX (liste du ${FW_REF.date}) pour ces modèles n'est pas présent sur le serveur, ou une version plus ancienne s'y trouve.`,
    'Lancer « Mettre à jour le firmware » sur ces téléphones depuis la console 3CX (le firmware recommandé est alors téléchargé), ou téléverser le fichier officiel (lien dans l\'onglet Téléphones).',
    srvBad.map(m => ({html: `<b>${esc(m.model)}</b> <span class="muted">— ${m.count} téléphone${m.count>1?'s':''} · recommandé ${esc(m.rec.version)} · serveur ${m.srv ? esc(fwVersion(m.srv)) : 'aucun'}</span>`, text: `${m.model} (${m.count}) : recommandé ${m.rec.version}, serveur ${m.srv ? fwVersion(m.srv) : 'aucun'}`})));
  if(phOld.length) add('fw-old', 'fix', 'Téléphones', `${phOld.length} téléphone${phOld.length>1?'s':''} avec un firmware plus ancien que la version recommandée par 3CX`,
    `Comparaison avec la liste officielle 3CX du ${FW_REF.date}.`,
    'Lancer « Mettre à jour le firmware » depuis la console 3CX, de préférence hors des heures d\'ouverture.',
    phOld.map(r => ({html: `${dnLink(r.ext)} <span class="muted">— ${esc(r.model)} ${esc(fwVersion(r.fw))} → ${esc(r.rec)}</span>`, text: `${r.ext} ${r.user} : ${r.model} ${r.fw} -> ${r.rec}`})));
  const phProb = ph.filter(r => r.st === 'prob');
  if(phProb.length) add('fw-prob', 'obs', 'Téléphones', `${phProb.length} téléphone${phProb.length>1?'s':''} probablement à jour mais dont le firmware a été effacé`,
    'Le firmware recommandé leur avait été assigné, puis il a été effacé lors d\'une modification du téléphone dans la console. Ils l\'ont très probablement installé, mais 3CX ne le réinstallera plus en cas de réinitialisation.',
    'Relancer « Mettre à jour le firmware » sur ces téléphones pour rétablir l\'assignation (sans effet s\'ils sont déjà à jour).',
    phProb.map(r => ({html: `${dnLink(r.ext)} <span class="muted">— ${esc(r.model)} · ${esc(fwVersion(r.er[1]))} effacé le ${esc(fmtD(r.er[2]))} par ${esc(r.er[3])}</span>`, text: `${r.ext} ${r.user} : ${r.er[1]} effacé le ${fmtD(r.er[2])} par ${r.er[3]}`})));
  if(phUnk.length) add('fw-unk', 'fix', 'Téléphones', `${phUnk.length} téléphone${phUnk.length>1?'s':''} dont la version de firmware est inconnue`,
    'Aucun firmware n\'est assigné à ces téléphones et aucune version n\'a été observée (ni dans les rapports de qualité d\'appel, ni dans un historique d\'effacement) : ils ont probablement leur firmware d\'usine.',
    'Sélectionner ces téléphones dans la console 3CX (Téléphones) et lancer « Mettre à jour le firmware » ; après toute modification d\'un téléphone, refaire cette action.',
    phUnk.map(r => ({html: `${dnLink(r.ext)} <span class="muted">— ${esc(r.model)} · ${esc(macFmt(r.mac))}</span>`, text: `${r.ext} ${r.user} : ${r.model} ${macFmt(r.mac)}`})));
  if(FULL.calls.length){
    const last = localParts(FULL.calls[0][0])[0], d30 = (() => { const x = new Date(last + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() - 29); return x.toISOString().slice(0, 10); })();
    const H = hoursAnalysis(d30, last), cwo = H.filter(r => r.closedWhileOpen.length), mh = H.filter(r => r.missingHol.length);
    if(cwo.length) add('hours-closed', 'fix', 'Horaires', `${cwo.length} département${cwo.length>1?'s':''} ont envoyé des appels au menu fermé pendant leurs heures d'ouverture`,
      'Sur les 30 derniers jours du backup, des appels entrants ont pris la branche « fermé » (ou pause) alors que l\'horaire configuré indiquait ouvert.',
      'Vérifier les horaires du département, un éventuel mode « fermé » forcé manuellement, ou un jour férié non configuré (détail dans l\'onglet Horaires).',
      cwo.map(r => ({html: `${dnLink(r.g.number)} <span class="muted">— ${r.closedWhileOpen.length} appel${r.closedWhileOpen.length>1?'s':''}</span>`, text: `${r.g.number} ${r.g.name} : ${r.closedWhileOpen.length}`})));
    if(mh.length) add('hours-holidays', 'fix', 'Horaires', `Jours fériés à venir non configurés dans ${mh.length} département${mh.length>1?'s':''}`,
      'Jours fériés du Québec des 90 prochains jours absents des horaires de ces départements : ces jours-là, les appels suivront l\'horaire normal.',
      'Ajouter les jours fériés dans les horaires des départements (console 3CX → Départements → Jours fériés).',
      mh.map(r => ({html: `${dnLink(r.g.number)} <span class="muted">— ${r.missingHol.map(([n, d]) => esc(n) + ' ' + d.slice(5)).join(', ')}</span>`, text: `${r.g.number} ${r.g.name} : ${r.missingHol.map(([n, d]) => n + ' ' + d).join(', ')}`})));
  }
  const order = {crit:0, fix:1, obs:2};
  return F.sort((a,b) => order[a.sev]-order[b.sev]);
}

// ---------- Notes (mémorisées dans ce navigateur, par backup) ----------
const NOTES_KEY = () => 'notes3cx:' + (D.info.fqdn||'') + '|' + (D.info.date||'');
function loadNotes(){ try{ return JSON.parse(localStorage.getItem(NOTES_KEY()) || '{}'); }catch(e){ return {}; } }
function saveNotes(n){ try{ localStorage.setItem(NOTES_KEY(), JSON.stringify(n)); return true; }catch(e){ return false; } }

V.reco = el => {
  const F = analyse();
  let notes = loadNotes(); notes.status ||= {}; notes.text ||= {}; notes.custom ||= [];

  <div class="grid kpis">${['crit','fix','obs'].map(s => `<div class="card kpi rk ${s}"><div class="v">${cnt(s)}</div><div class="l">${SEV[s].l}</div></div>`).join('')}
    <div class="card kpi"><div class="v">${Object.values(notes.status).filter(x => x==='done').length + notes.custom.filter(c => c.status==='done').length}</div><div class="l">Points corrigés</div></div></div>

  <h3 style="margin-top:26px">Mes observations</h3>
  <div class="card rnew"><div class="rnewrow"><select id="nsev">${Object.entries(SEV).map(([k,v]) => `<option value="${k}"${k==='obs'?' selected':''}>${v.l}</option>`).join('')}</select>
    <input type="text" id="ntitle" placeholder="Titre (ex. Revoir le message du menu fermé)"></div>

  <div id="clist"></div></div>`;
  const W = $('#rwrap');
  const persist = () => { if(!saveNotes(notes)) $('#nmsg').textContent = 'Attention : le navigateur refuse la mémorisation, les notes seront perdues à la fermeture.'; };
  const stSel = (id, v) => `<select class="rstsel" data-id="${esc(id)}">${Object.entries(NOTE_ST).map(([k,l]) => `<option value="${k}"${(v||'todo')===k?' selected':''}>${l}</option>`).join('')}</select>`;
  function drawList(){
    const q = $('#rq').value.toLowerCase(), sv = $('#rsev').value, ct = $('#rcat').value, ss = $('#rst').value;
    const list = F.filter(f => (!sv || f.sev===sv) && (!ct || f.cat===ct) && (!ss || (notes.status[f.id]||'todo')===ss) &&
      (!q || [f.title, f.detail, f.reco, f.cat, notes.text[f.id]||'', ...f.items.map(i => i.text)].join(' ').toLowerCase().includes(q)));
    $('#rlist').innerHTML = list.map(f => { const s = notes.status[f.id]||'todo';
      return `<details class="card rcard ${f.sev} st-${s}" data-id="${esc(f.id)}"><summary>
        <span class="pill ${SEV[f.sev].c}">${SEV[f.sev].l}</span><span class="pill">${esc(f.cat)}</span>
        <span class="rt">${esc(f.title)}</span>${stSel(f.id, s)}</summary>
        <div class="rb"><p>${esc(f.detail)}</p><p class="rreco"><b>Recommandation :</b> ${esc(f.reco)}</p>
        ${f.items.length ? `<div class="ritems"><div class="muted" style="font-size:12px;margin-bottom:4px">Éléments concernés (${f.items.length})</div>${f.items.slice(0, 200).map(i => `<span class="ritem">${i.html}</span>`).join('')}${f.items.length>200?`<span class="muted">+ ${f.items.length-200} autres</span>`:''}</div>` : ''}
        <label class="muted" style="font-size:12px">Ma note</label><textarea class="rnote" data-id="${esc(f.id)}" rows="2" placeholder="Ajouter une note…">${esc(notes.text[f.id]||'')}</textarea></div></details>`; }).join('')
      || '<p class="muted">Aucune recommandation ne correspond aux filtres.</p>';

  function drawCustom(){
    $('#clist').innerHTML = notes.custom.map((c, i) => `<div class="card rcard ${c.sev} st-${c.status||'todo'}"><div class="rhead">
      <span class="pill ${SEV[c.sev].c}">${SEV[c.sev].l}</span><span class="rt">${esc(c.title)}</span>
      <span class="muted" style="font-size:12px">${esc(fmtD(c.date))}</span>${stSel('custom:'+i, c.status)}<button class="btn rdel" data-i="${i}" title="Supprimer">×</button></div>
      ${c.text ? `<p class="rctext">${esc(c.text)}</p>` : ''}</div>`).join('') || '<p class="muted">Aucune observation ajoutée pour l\'instant.</p>';
  }
  drawList(); drawCustom();
  ['#rq','#rsev','#rcat','#rst'].forEach(s => $(s).addEventListener('input', drawList));
  W.addEventListener('change', e => { const s = e.target.closest('.rstsel'); if(!s) return; const id = s.dataset.id;

  W.addEventListener('click', e => { if(e.target.closest('.rstsel')) e.preventDefault(); });
  W.addEventListener('input', e => { const t = e.target.closest('.rnote'); if(!t) return; notes.text[t.dataset.id] = t.value; persist(); });
  $('#nadd').addEventListener('click', () => { const t = $('#ntitle').value.trim(); if(!t){ $('#ntitle').focus(); return; }
    notes.custom.unshift({sev: $('#nsev').value, title: t, text: $('#ntext').value.trim(), date: new Date().toISOString(), status: 'todo'});
    $('#ntitle').value = ''; $('#ntext').value = ''; persist(); drawCustom(); });
  $('#clist').addEventListener('click', e => { const b = e.target.closest('.rdel'); if(!b) return;
    if(confirm('Supprimer cette observation ?')){ notes.custom.splice(+b.dataset.i, 1); persist(); drawCustom(); } });
  $('#rexp').addEventListener('click', () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = [['Sévérité','Catégorie','Titre','Détail','Recommandation','Éléments concernés','Statut','Note']];
    F.forEach(f => rows.push([SEV[f.sev].l, f.cat, f.title, f.detail, f.reco, f.items.map(i => i.text).join(' | '), NOTE_ST[notes.status[f.id]||'todo'], notes.text[f.id]||'']));
    notes.custom.forEach(c => rows.push([SEV[c.sev].l, 'Observation manuelle', c.title, c.text, '', '', NOTE_ST[c.status||'todo'], '']));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(q).join(';')).join('\r\n')], {type: 'text/csv;charset=utf-8'}));
    a.download = 'recommandations-3cx.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $('#rprint').addEventListener('click', () => { W.querySelectorAll('details.rcard').forEach(d => d.open = true); window.print(); });
};

// ---------- Onglet Magasins : noms, type et corrections d'attribution ----------
function segStats(c){
  const n = arr => arr.filter(x => SEGOF[x.number] === c).length;
  const sda = Object.values(DIDSEG).filter(x => x === c).length;
  return {postes: n(FULL.extensions), files: n(FULL.queues), ivr: n(FULL.ivrs), dep: n(FULL.groups), sda};
}

  <h3>Codes détectés</h3>
  <div class="tw"><table><thead><tr><th>Code</th><th>Nom du magasin</th><th>Type</th><th class="num">Postes</th><th class="num">Départements</th><th class="num">Files</th><th class="num">IVR</th><th class="num">SDA</th></tr></thead><tbody>

    ${SEGCFG.common[c] ? '<td colspan="5" class="muted">regroupé dans « Commun / non attribué »</td>' : `<td class="num">${s.postes}</td><td class="num">${s.dep}</td><td class="num">${s.files}</td><td class="num">${s.ivr}</td><td class="num">${s.sda}</td>`}</tr>`; }).join('')}
  ${[SEG_COMMON, SEG_BRIDGE].map(c => { const s = segStats(c); return `<tr class="muted"><td class="mono">${c===SEG_COMMON?'—':'↗'}</td><td>${esc(segName(c))}</td><td></td><td class="num">${s.postes}</td><td class="num">${s.dep}</td><td class="num">${s.files}</td><td class="num">${s.ivr}</td><td class="num">${s.sda}</td></tr>`; }).join('')}
  </tbody></table></div>
  <h3>Attribution des éléments</h3>
  <div class="bar"><span class="muted" style="font-size:12.5px">${Object.keys(SEGCFG.overrides).length} correction${Object.keys(SEGCFG.overrides).length>1?'s':''} manuelle${Object.keys(SEGCFG.overrides).length>1?'s':''}</span>
    <button class="btn" id="mreset"${Object.keys(SEGCFG.overrides).length?'':' disabled'}>Annuler les corrections</button></div>
  <div id="mt"></div></div>`;
  const W = $('#mwrap');
  table($('#mt'), {
    rows, pageSize: 60, sort: [0, 1], state: (window.__magTable ||= {}),
    search: r => [r.type, r.n, r.name, segName(SEGOF[r.n]), segName(autoNorm(r.n))].join(' '),
    filters: [
      {label: 'Tous les types', options: [...new Set(rows.map(r => r.type))].map(t => [t, t]), test: (r, v) => r.type === v},
      {label: 'Tous les magasins', options: [...codes.filter(c => !SEGCFG.common[c]), SEG_COMMON, SEG_BRIDGE].map(c => [c, segName(c)]), test: (r, v) => SEGOF[r.n] === v},
      {label: 'Toutes les attributions', options: [['m', 'Corrigées manuellement'], ['a', 'Automatiques']], test: (r, v) => !!SEGCFG.overrides[r.n] === (v === 'm')},

    cols: [

    else return;
    saveSegCfg();
    // nouvel affichage complet (le magasin de chaque élément change partout), puis retour au même endroit

// ---------- Téléphones : inventaire et firmware (référence officielle 3CX) ----------
const fwPrefix = f => String(f || '').split(/[-_]/)[0];
const fwVersion = f => String(f || '').replace(/^[^-_]*[-_]/, '').replace(/\.(rom|z|bin|img|zip)$/i, '');
const verCmp = (a, b) => { const x = String(a).split(/\D+/).filter(Boolean).map(Number), y = String(b).split(/\D+/).filter(Boolean).map(Number);
  for(let i = 0; i < Math.max(x.length, y.length); i++){ const d = (x[i]||0) - (y[i]||0); if(d) return d < 0 ? -1 : 1; } return 0; };
const modelKey = m => String(m || '').toLowerCase().replace(/\bdoor-?phone\b/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

// Référence 3CX : la plus récente entre la liste intégrée, le fichier du script et un copier-coller mémorisé
const FW_REF_KEY = 'fw3cx-colle';
function fwRefs(){
  const out = [FW_3CX_REF];
  if(window.FW_3CX_FILE && Array.isArray(window.FW_3CX_FILE.list)) out.push(window.FW_3CX_FILE);
  try{ const p = JSON.parse(localStorage.getItem(FW_REF_KEY) || 'null'); if(p && Array.isArray(p.list)) out.push(p); }catch(e){}
  return out;
}
const FW_REF = fwRefs().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : ({colle:0, script:1, integree:2}[a.source] - {colle:0, script:1, integree:2}[b.source])))[0];
const FW_REC = {}; // clé modèle -> {model, version, file, url}
FW_REF.list.forEach(([model, version, file, desc, url]) => { const k = modelKey(model); if(!FW_REC[k]) FW_REC[k] = {model, version, file, desc, url}; });
const recFor = model => FW_REC[modelKey(model)] || null;
const FW_SRC_FR = {integree: 'liste intégrée à l\'interface', script: 'téléchargée par verifier-firmwares.command', colle: 'collée depuis la page 3CX'};

// Firmwares présents sur le serveur 3CX (backup)
const FW_SERVER = (FULL.firmwares || []).map(f => f.file);
const serverFor = model => { const r = recFor(model); const pre = r ? fwPrefix(r.file) : null;
  const cands = FW_SERVER.filter(f => pre ? fwPrefix(f) === pre : false); return cands.sort((a, b) => verCmp(fwVersion(b), fwVersion(a)))[0] || ''; };

const PH_ST = {old:{l:'À mettre à jour', c:'bad'}, unk:{l:'Inconnu', c:'warn'}, prob:{l:'Probablement à jour', c:'acc'}, okv:{l:'À jour (vérifié)', c:'ok'}, ok:{l:'À jour', c:'ok'}, new:{l:'Plus récent que 3CX', c:'acc'}, nt:{l:'Modèle hors liste 3CX', c:''}};
const PH_ORDER = ['old', 'unk', 'prob', 'new', 'nt', 'okv', 'ok'];
const HAS_EVIDENCE = Array.isArray(FULL.fwErased) && Array.isArray(FULL.phoneUA);
const UA_BY = {}; (FULL.phoneUA || []).forEach(u => UA_BY[u[0]] = u);       // dernière version vue par MAC
const ERASED_BY = {}; (FULL.fwErased || []).forEach(e => ERASED_BY[e[0]] = e); // dernier effacement par MAC
function phoneRows(){
  const rows = [];
  D.extensions.forEach(e => e.devices.forEach(d => {
    const rec = recFor(d.model), srv = serverFor(d.model), mac = (d.mac || '').toUpperCase();
    const target = rec ? rec.version : (srv ? fwVersion(srv) : '');
    const ua = UA_BY[mac] || null, er = ERASED_BY[mac] || null;
    const cmp = v => target ? verCmp(v, target) : 0;
    let st, why = '';
    if(d.firmware){ // firmware assigné par 3CX
      if(!target) st = 'nt'; else { const c = cmp(fwVersion(d.firmware)); st = c < 0 ? 'old' : c > 0 ? 'new' : 'ok'; }
      why = 'Firmware assigné par 3CX : ' + fwVersion(d.firmware);
      if(ua && st === 'ok' && cmp(ua[2]) === 0){ st = 'okv'; why += ' — confirmé par le téléphone le ' + fmtD(ua[3]); }
    } else if(ua){ // version annoncée par le téléphone lors d'un appel
      const c = cmp(ua[2]); st = !target ? 'nt' : c < 0 ? 'old' : c > 0 ? 'new' : 'okv';
      why = `Version ${ua[2]} annoncée par le téléphone le ${fmtD(ua[3])} (rapport de qualité d'appel)`;
    } else if(er){ // firmware assigné puis effacé par une modification
      const c = cmp(fwVersion(er[1])); st = !target ? 'nt' : c < 0 ? 'old' : 'prob';
      why = `Firmware ${fwVersion(er[1])} assigné, puis effacé le ${fmtD(er[2])} par ${er[3]} (modification du téléphone)`;
    } else { st = 'unk'; why = 'Aucun firmware assigné et aucune version observée'; }
    rows.push({ext: e.number, user: (e.first + ' ' + e.last).trim(), model: d.model || d.template, mac: d.mac, fw: d.firmware,
      srv, rec: rec ? rec.version : '', st, why, ua, er, template: d.template, seg: SEGOF[e.number]});
  }));
  return rows;
}
function showPhone(r){
  openDrawer(`${esc(r.ext)} ${esc(r.user)} — ${esc(r.model)}`, kv([
    ['État', `<span class="pill ${PH_ST[r.st].c}">${PH_ST[r.st].l}</span>`], ['Explication', esc(r.why)],
    ['MAC', `<span class="mono">${esc(macFmt(r.mac))}</span>`], ['Firmware assigné', r.fw ? `<span class="mono">${esc(r.fw)}</span>` : '—'],

function modelRows(rows){
  return [...new Set(rows.map(r => r.model))].sort().map(m => {
    const rec = recFor(m), srv = serverFor(m), rs = rows.filter(r => r.model === m);
    let st;
    if(!rec) st = 'nolist';
    else if(!Array.isArray(FULL.firmwares)) st = 'srvunk';
    else if(!srv) st = 'missing';
    else st = verCmp(fwVersion(srv), rec.version) < 0 ? 'srvold' : 'srvok';
    return {model: m, rec, srv, st, count: rs.length, rows: rs};
  });
}

function parseFwPaste(txt){
  const list = [];
  String(txt).split(/\r?\n/).forEach(line => {
    const cells = line.split('\t').map(c => c.trim()).filter(Boolean);
    let m = null, v = null;
    if(cells.length >= 2 && /^\d+(\.\d+){2,}$/.test(cells[1])){ m = cells[0]; v = cells[1]; }
    else { const x = line.match(/^\s*([A-Za-z][A-Za-z0-9 +\-]*?)\s+(\d+(?:\.\d+){2,5})\b/); if(x){ m = x[1]; v = x[2]; } }
    if(m && v && /yealink|fanvil|snom|grandstream|gigaset|htek|alcatel|cisco|polycom|poly|aastra|mitel|panasonic|akuvox|2n/i.test(m) && !list.some(r => r[0] === m)) list.push([m, v, '', '', '']);
  });
  return list;
}

const ST_PAL = ['#2563eb', '#0d9488', '#d97706', '#db2777', '#7c3aed', '#65a30d', '#dc2626', '#0891b2', '#9333ea', '#ca8a04'];
const WD = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
// heure locale (Est) rapide : décalage calculé une fois par heure UTC puis mis en cache -> [jour 'AAAA-MM-JJ', heure, jour de semaine 0=lundi]
const _tzOff = {};
function localParts(iso){
  const k = iso.slice(0, 13); let o = _tzOff[k];
  if(o === undefined){ const d = new Date(k + ':00:00Z'); o = _tzOff[k] = Date.parse(d.toLocaleString('sv-SE', {timeZone: TZ}).replace(' ', 'T') + 'Z') - d.getTime(); }
  const t = new Date(Date.parse(iso) + o); return [t.toISOString().slice(0, 10), t.getUTCHours(), (t.getUTCDay() + 6) % 7];
}
// magasin d'un appel (un seul, pour comparer sans double compte) : SDA pour les entrants, poste d'origine sinon
const callSeg = c => {
  if(c[1] === 'in'){ const s = DIDSEG[c[5]]; if(s && s !== SEG_COMMON) return s; const p = c[9].find(x => SEGOF[x[0]] && SEGOF[x[0]] !== SEG_COMMON); return p ? SEGOF[p[0]] : (s || SEG_COMMON); }
  return SEGOF[c[2]] || SEGOF[c[6]] || SEG_COMMON;
};
const ST_ANS = new Set(['ans', 'fwd_ok']), ST_LOST = new Set(['q_ab', 'ivr_ab', 'miss', 'fwd_no', 'park_ab']);
const STATS_KEY = 'stats3cx-periode';
function statsPeriod(){ let p = {}; try{ p = JSON.parse(localStorage.getItem(STATS_KEY) || '{}'); }catch(e){} return {mode: p.mode || '30', from: p.from || '', to: p.to || ''}; }

V.stats = el => {

  const range = () => P.mode === 'all' ? [firstDay, lastDay] : P.mode === 'custom' ? [P.from || firstDay, P.to || lastDay] : [addDays(lastDay, -(+P.mode) + 1), lastDay];

  <div class="bar"><label class="count">Période</label>

function backupDateISO(s){
  const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap])?/i);

}

function cmpDiff(OLD, NEW){
  const co = cmpCategories(OLD), cn = cmpCategories(NEW);
  return cn.map((cat, i) => {
    const o = co[i], mo = new Map(o.items.map(x => [cat.id(x), x])), mn = new Map(cat.items.map(x => [cat.id(x), x]));
    const added = [], removed = [], changed = [];
    mn.forEach((x, k) => { if(!mo.has(k)) added.push(x); });
    mo.forEach((x, k) => { if(!mn.has(k)) removed.push(x); });
    mn.forEach((x, k) => {
      const y = mo.get(k); if(!y) return;
      const fa = o.fields(y), fb = cat.fields(x), diffs = [];
      Object.keys(fb).forEach(f => {
        const a = fa[f], b = fb[f];
        if(Array.isArray(b) || Array.isArray(a)){

          const plus = [...B].filter(v => !A.has(v)), minus = [...A].filter(v => !B.has(v));
          if(plus.length || minus.length) diffs.push({f, plus, minus});
        } else if(String(a ?? '') !== String(b ?? '')) diffs.push({f, a: a ?? '', b: b ?? ''});
      });
      if(diffs.length) changed.push({x, diffs});
    });
    return {cat, o, added, removed, changed};
  });
}
