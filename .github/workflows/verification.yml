# Repository check on every push and pull request: builds the pages with Vite and checks them.
# On failure, GitHub e-mails the person who pushed.
name: Contrôle du dépôt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    name: Build, pages, liens et données sensibles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # older versions (19.0 and later) are built from their git tags v<n>
      - uses: jdx/mise-action@v2   # installs Node as pinned in mise.toml
      - name: Build, compare with the committed pages, check
        run: mise run ci
